/** targetSelector: the id of the textarea to fill, e.g. '#sc-res' */
async function wireResumePicker(container,targetSelector,onFilled){
  const box=container.querySelector('#rp-box'); if(!box) return;
  const sel=box.querySelector('#rp-select'), msg=box.querySelector('#rp-msg');
  const fillTarget=(txt)=>{ const t=container.querySelector(targetSelector); if(t){ t.value=txt; t.dispatchEvent(new Event('input',{bubbles:true})); } if(onFilled) onFilled(txt); };
  async function refresh(){
    if(!RESUMES.signedIn()){ sel.innerHTML='<option value="">Sign in to save and reuse resumes</option>'; return; }
    const list=await RESUMES.list();
    if(!list.length){ sel.innerHTML='<option value="">No saved resumes yet, upload one below</option>'; return; }
    sel.innerHTML=list.map(r=>`<option value="${r.id}" ${r.is_default?'selected':''}>${r.is_default?'★ ':''}${r.label}</option>`).join('');
    box.dataset.list=JSON.stringify(list);
  }
  await refresh();
  box.querySelector('#rp-use').onclick=()=>{
    const list=JSON.parse(box.dataset.list||'[]'); const rec=list.find(r=>String(r.id)===sel.value);
    if(!rec){ msg.textContent='Pick a resume first.'; return; }
    if(!rec.extracted_text){ msg.textContent="This file's text couldn't be read, try re-uploading it."; return; }
    fillTarget(rec.extracted_text); msg.textContent='Loaded, re-check below.'; msg.className='rp-msg ok';
  };
  box.querySelector('#rp-upload').onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    msg.textContent='Reading the file…'; msg.className='rp-msg';
    const {text}=await RESUMES.extractText(file);
    if(!text){ msg.textContent="Couldn't read text from that file. Try a text-based PDF or a .docx."; return; }
    fillTarget(text);
    box.dataset.pendingFile='1'; window.__rp_pending_file=file;
    box.querySelector('#rp-save-row').style.display='block';
    box.querySelector('#rp-label').value=RESUMES.suggestLabel(null,'','');
    msg.textContent='Loaded into the box below, re-check, then save it to your library if you want to reuse it.'; msg.className='rp-msg ok';
  };
  box.querySelector('#rp-save').onclick=async()=>{
    const file=window.__rp_pending_file; if(!file){ msg.textContent='Upload a file first.'; return; }
    const company=box.querySelector('#rp-company').value.trim(), role=box.querySelector('#rp-role').value.trim();
    const label=box.querySelector('#rp-label').value.trim()||RESUMES.suggestLabel(null,company,role);
    const setDefault=box.querySelector('#rp-default').checked;
    msg.textContent='Saving…';
    try{ await RESUMES.save({file,label,company,role,setDefault}); msg.textContent='Saved to your library.'; msg.className='rp-msg ok';
      box.querySelector('#rp-save-row').style.display='none'; await refresh(); }
    catch(err){ msg.textContent=err.message; msg.className='rp-msg warn'; }
  };
}

const SCUI=(()=>{
  const E=SC.esc; let S={};
  function mount(el,opts={}){
    S={el,title:'',jd:'',res:'',excluded:new Set(),tab:'match',report:null,ai:opts.ai||null,sample:opts.sample||null,timer:null,fixes:[],accepted:new Set()};
    el.innerHTML=`<div class="sc">
      <div class="sc-in">
        <div class="sc-f"><label>Job title (as written in the posting)</label><input class="sc-inp" id="sc-title" placeholder="Senior Program Manager"></div>
        <div class="sc-f"><label>Job description</label><textarea class="sc-ta" id="sc-jd" placeholder="Paste the full posting…"></textarea></div>
        <div class="sc-f">${resumePickerHTML()}<label>Your resume <span class="sc-live" id="sc-livetag">live, edits re-score as you type</span></label><textarea class="sc-ta sc-res" id="sc-res" placeholder="Paste your resume text, or pick one above…"></textarea></div>
        <div class="sc-row"><button class="sc-btn" id="sc-scan">Scan</button>${S.sample?'<button class="sc-btn sec" id="sc-sample">Load sample</button>':''}</div>
      </div>
      <div class="sc-out" id="sc-out"><div class="sc-empty">Paste a posting and your resume, then scan. You'll get a match score, the exact missing keywords, and a resume check, the same report an ATS-style scanner gives.</div></div>
    </div>`;
    el.querySelector('#sc-scan').onclick=()=>scan();
    if(S.sample) el.querySelector('#sc-sample').onclick=()=>{el.querySelector('#sc-title').value=S.sample.title;el.querySelector('#sc-jd').value=S.sample.jd;el.querySelector('#sc-res').value=S.sample.res;scan();};
    el.querySelector('#sc-res').addEventListener('input',()=>{ if(!S.report) return; clearTimeout(S.timer); S.timer=setTimeout(()=>scan(true),350); });
  }
  function scan(live){
    const el=S.el; S.title=el.querySelector('#sc-title').value.trim(); S.jd=el.querySelector('#sc-jd').value; S.res=el.querySelector('#sc-res').value;
    if(!S.jd.trim()||!S.res.trim()){ el.querySelector('#sc-out').innerHTML='<div class="sc-empty">Both the job description and your resume are needed.</div>'; return; }
    S.report=SC.analyze(S.res,S.jd,{title:S.title,excluded:S.excluded});
    render(live);
  }
  function tabBtn(id,label){ return `<button class="sc-tab ${S.tab===id?'on':''}" data-t="${id}">${label}</button>`; }
  function render(live){
    const r=S.report, out=S.el.querySelector('#sc-out');
    const col=r.score>=80?'var(--ok)':r.score>=60?'var(--warn)':'var(--human)';
    const verdict=r.score>=80?'Competitive. Your resume clears the recommended 80 for this posting.':r.score>=60?"You're almost there. The computed match is below the recommended 80, there's a good chance an ATS ranks you below other applicants. Add the relevant missing skills below to get above 80.":'Below the screen line. There is a high probability this resume is filtered before a person sees it. Work through the missing hard skills first.';
    const head=`<div class="sc-score-wrap">
      <div class="sc-gauge" style="--pct:${r.score};--col:${col}"><div class="sc-gauge-n">${r.score}</div><div class="sc-gauge-l">match score${live?' · live':''}</div></div>
      <div class="sc-subs">
        ${sub('Hard skills',r.sub.hard)}${sub('Soft skills',r.sub.soft)}${sub('Other keywords',r.sub.other)}${sub('Degree & title',r.sub.degTitle)}
      </div></div>
      <p class="sc-verdict">${verdict}</p>
      <div class="sc-tabs">${tabBtn('match','Match report')}${tabBtn('resume','Resume report')}${tabBtn('kw','Keywords')}${tabBtn('jd','Job description')}${tabBtn('fix','Fix with AI')}</div>
      <div id="sc-tabbody">${body()}</div>`;
    out.innerHTML=head;
    out.querySelectorAll('.sc-tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;out.querySelectorAll('.sc-tab').forEach(x=>x.classList.toggle('on',x===b));out.querySelector('#sc-tabbody').innerHTML=body();wire();});
    wire();
  }
  function sub(l,v){ const c=v>=80?'var(--ok)':v>=60?'var(--warn)':'var(--human)'; return `<div class="sc-sub"><div class="sc-sub-n" style="color:${c}">${v}</div><div class="sc-sub-l">${l}</div><div class="sc-sub-bar"><i style="width:${v}%;background:${c}"></i></div></div>`; }
  const chips=(rows,cls='')=>rows.length?rows.map(x=>`<span class="sc-chip ${cls}" data-k="${E(x.key)}" title="Click to exclude, the score recalculates">${E(x.term)} <em>×${x.job}</em></span>`).join(''):'<span class="sc-none">None, nice.</span>';
  function body(){
    const r=S.report, m=r.missing, c=r.checks;
    if(S.tab==='match'){
      return `<table class="sc-rep">
        <tr><th>Hard skills</th><td>${m.hard.length?`You are missing <b>${m.hard.length}</b> important hard skill${m.hard.length>1?'s':''}. If you have experience with any of these, check the context in the posting and add them where true.<div class="sc-chips">${chips(m.hard,'miss')}</div>`:'<b>All hard skills found.</b> Every hard skill the posting names appears on your resume.'}</td></tr>
        <tr><th>Soft skills</th><td>${m.soft.length?`You are missing <b>${m.soft.length}</b> soft skill${m.soft.length>1?'s':''}. These matter less than hard skills, but the exact words still help you rank.<div class="sc-chips">${chips(m.soft,'miss')}</div>`:'<b>All soft skills found.</b>'}</td></tr>
        <tr><th>Other keywords</th><td>${m.other.length?`You are missing <b>${m.other.length}</b> other keyword${m.other.length>1?'s':''} the employer uses. Mirror their language where it's true for you.<div class="sc-chips">${chips(m.other,'miss')}</div>`:'<b>All other keywords found.</b>'}</td></tr>
        <tr><th>Job title match</th><td>${r.title.found===null?'<span class="sc-none">Enter the job title above to check it.</span>':r.title.found?`<b>Great work.</b> The job title <b>${E(r.title.title)}</b> appears in your resume. Recruiters sometimes search by exact title, so this helps.`:`<b>Missing.</b> The exact title <b>${E(r.title.title)}</b> doesn't appear in your resume. Put it in your headline or summary, e.g. "${E(r.title.title)} (internal title: …)".`}</td></tr>
        <tr><th>Degree match</th><td>${r.degree.required===0?`The posting states no degree requirement. Your resume shows <b>${r.degree.hasName}</b>.`:r.degree.ok?`<b>Congratulations.</b> Your resume shows a <b>${r.degree.hasName}</b> and the posting requires a <b>${r.degree.reqName}</b>.`:`<b>Gap.</b> The posting asks for a <b>${r.degree.reqName}</b>; your resume shows <b>${r.degree.hasName}</b>. If you have it, add it; if not, lead with equivalent experience.`}</td></tr>
      </table><p class="sc-note">Click any missing keyword to exclude it (if it doesn't apply to you), the score recalculates without it.</p>`;
    }
    if(S.tab==='resume'){
      const wc=c.words<500?`This is below the recommended 500–700 words. Add specifics, a number in every bullet.`:c.words>700?`This is above the recommended 500–700. Fine if you have 10+ years or are applying to federal roles; otherwise trim.`:`Right in the recommended 500–700 range.`;
      return `<table class="sc-rep">
        <tr><th>Word count</th><td>Your resume has <b>${c.words}</b> words. ${wc}</td></tr>
        <tr><th>Email address</th><td>${c.email?`Found: <b>${E(c.email)}</b>`:'<b>Not found.</b> Add a plain-text email (not an icon) near the top.'}</td></tr>
        <tr><th>Phone number</th><td>${c.phone?`Found: <b>${E(c.phone)}</b>`:'<b>Not found.</b> Add a phone number in plain text.'}</td></tr>
        <tr><th>LinkedIn</th><td>${c.linkedin?'Found.':'<b>Not found.</b> Add linkedin.com/in/yourname, recruiters cross-check it.'}</td></tr>
        <tr><th>Sections</th><td>${['experience','skills','education','summary'].map(k=>`<span class="sc-chip ${c.sections[k]?'hit':'miss'}">${k[0].toUpperCase()+k.slice(1)}</span>`).join(' ')}</td></tr>
        <tr><th>Accomplishments</th><td>${c.accomplishments.length?`<b>Good work.</b> Your resume has <b>${c.accomplishments.length}</b> quantifiable accomplishment${c.accomplishments.length>1?'s':''}.<div class="sc-quotes">${c.accomplishments.slice(0,4).map(a=>`<div>“${E(a.replace(/^[-•▪◦*]\s*/,'').slice(0,140))}${a.length>140?'…':''}”</div>`).join('')}</div>`:'<b>Warning.</b> No quantified accomplishments found. Add a number ($, %, count, time) to your strongest bullets.'}</td></tr>
        <tr><th>Word choice</th><td>${c.bad.length?`<b>Warning.</b> <b>${c.bad.reduce((n,x)=>n+x.n,0)}</b> filler phrase${c.bad.length>1?'s':''} that recruiters skim past: ${c.bad.map(x=>`<span class="sc-chip miss">${E(x.v)} <em>×${x.n}</em></span>`).join(' ')}`:'<b>Good work.</b> No filler phrases found.'}</td></tr>
        <tr><th>Verb choice</th><td>${c.weak.length?`<b>Warning.</b> <b>${c.weak.reduce((n,x)=>n+x.n,0)}</b> weak verb${c.weak.length>1?'s':''} to replace with action verbs that describe your contribution: ${c.weak.map(x=>`<span class="sc-chip miss">${E(x.v)} <em>×${x.n}</em></span>`).join(' ')}<div class="sc-quotes"><div>Try: ${SC.STRONG_VERBS.slice(0,14).join(', ')}…</div></div>`:'<b>Good work.</b> No weak verbs found.'} Strong action verbs used: <b>${c.strong}</b>.</td></tr>
        <tr><th>Personal pronouns</th><td>${c.pron.length?`<b>Warning.</b> <b>${c.pron.reduce((n,x)=>n+x.n,0)}</b> personal pronoun${c.pron.reduce((n,x)=>n+x.n,0)>1?'s':''}. A resume is about you, so they're redundant: instead of "I increased revenue 20%" write "Increased revenue 20%". ${c.pron.map(x=>`<span class="sc-chip miss">${E(x.v)} <em>×${x.n}</em></span>`).join(' ')}`:'<b>Good work.</b> No personal pronouns.'}</td></tr>
        <tr><th>Date formatting</th><td>${c.dates.years?`Your resume shows <b>${c.dates.years} years</b> of experience. `:'No date ranges detected. '}${c.dates.consistent?'<b>Date formatting looks great.</b>':`<b>Warning.</b> Mixed date formats (${c.dates.formats.join(', ')}). Pick one, parsers compute tenure from dates and mixed formats break it.`}</td></tr>
        <tr><th>Bullets</th><td>${c.bullets>=6?`<b>${c.bullets}</b> bullets found.`:`Only <b>${c.bullets}</b> bullet lines found. Use bullets (start lines with - or •) so parsers and recruiters can scan.`}</td></tr>
      </table>`;
    }
    if(S.tab==='kw'){
      const tbl=(name,rows)=>`<h4 class="sc-h">${name}</h4><table class="sc-kw"><tr><th>Skill</th><th>Job count</th><th>Resume count</th><th></th><th></th></tr>${rows.map(x=>`<tr class="${x.ex?'ex':''}"><td>${E(x.term)}</td><td>${x.job}</td><td class="${x.res===0&&!x.ex?'z':''}">${x.res}</td><td class="sc-bars"><i style="width:${Math.min(100,x.job*20)}%"></i><i class="r" style="width:${Math.min(100,x.res*20)}%"></i></td><td><span class="sc-x" data-k="${E(x.key)}" title="${x.ex?'Include again':'Exclude, doesn\'t apply to me'}">${x.ex?'↺':'✕'}</span></td></tr>`).join('')}</table>`;
      return `<p class="sc-note">Terms are ranked by how often the employer mentions them, a skill repeated three times is what the role is really about. Exclude anything that doesn't apply; the score recalculates.</p>${tbl('Hard skills',S.report.hard)}${tbl('Soft skills',S.report.soft)}${tbl('Other keywords',S.report.other)}<p class="sc-note"><i class="sc-leg j"></i> job count &nbsp; <i class="sc-leg r"></i> resume count</p>`;
    }
    if(S.tab==='jd'){
      return `<p class="sc-note"><mark class="hit">green</mark> = on your resume &nbsp; <mark class="miss">yellow</mark> = missing. Read the missing ones in context, that's how you decide whether they're true for you.</p><div class="sc-jd">${S.report.jdHtml}</div>`;
    }
    if(S.tab==='fix'){
      const miss=[...m.hard,...m.soft].slice(0,12);
      const aiOn=!!(S.ai&&S.ai.ready&&S.ai.ready());
      return `<h4 class="sc-h">Turn missing keywords into achievement bullets</h4>
        <p class="sc-note">Pick the keywords you actually have experience with. ${aiOn?'AI writes a bullet around each one, in your voice, for you to accept or skip.':'Add an AI key in Settings to generate bullets; without it you get a fill-in template for each.'}</p>
        <div class="sc-chips" id="sc-pick">${miss.map(x=>`<span class="sc-chip pick" data-k="${E(x.key)}" data-t="${E(x.term)}">${E(x.term)}</span>`).join('')||'<span class="sc-none">No missing hard or soft skills.</span>'}</div>
        <div class="sc-f"><label>Context for these (optional, what you did, any numbers)</label><textarea class="sc-ta" id="sc-ctx" style="min-height:60px"></textarea></div>
        <button class="sc-btn" id="sc-gen">${aiOn?'Generate bullets':'Build templates'}</button>
        <div id="sc-gen-out"></div>
        <h4 class="sc-h" style="margin-top:22px">Auto-optimize: rewrite my bullets around this posting</h4>
        <p class="sc-note">${aiOn?'AI rewrites each bullet to mirror the posting where it\'s true, and shows it next to your original. Nothing changes until you accept.':'Needs an AI key.'}</p>
        <button class="sc-btn sec" id="sc-auto" ${aiOn?'':'disabled'}>Suggest rewrites</button>
        <div id="sc-auto-out"></div>`;
    }
  }
  function wire(){
    const out=S.el.querySelector('#sc-out');
    out.querySelectorAll('.sc-chip.miss[data-k],.sc-x[data-k]').forEach(x=>x.onclick=()=>{const k=x.dataset.k; S.excluded.has(k)?S.excluded.delete(k):S.excluded.add(k); scan();});
    out.querySelectorAll('.sc-chip.pick').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
    const gen=out.querySelector('#sc-gen'); if(gen) gen.onclick=genBullets;
    const auto=out.querySelector('#sc-auto'); if(auto) auto.onclick=autoOpt;
  }
  async function genBullets(){
    const picked=[...S.el.querySelectorAll('.sc-chip.pick.on')].map(x=>x.dataset.t); const ctx=S.el.querySelector('#sc-ctx').value; const O=S.el.querySelector('#sc-gen-out');
    if(!picked.length){O.innerHTML='<p class="sc-note">Pick at least one keyword.</p>';return;}
    if(!(S.ai&&S.ai.ready&&S.ai.ready())){ O.innerHTML=picked.map(k=>`<div class="sc-sugg"><b>${E(k)}</b><div class="sc-tpl">[Action verb] [what you did using ${E(k)}] for [scope], [result with a number]</div><div class="sc-tpl">e.g. "Applied ${E(k)} across [N] [projects/teams], [cutting/raising] [metric] [X%]"</div></div>`).join(''); return; }
    O.innerHTML='<p class="sc-note">Writing…</p>';
    try{ const txt=await S.ai.run('You write resume bullets. For each keyword, write ONE bullet (under 25 words) that opens with a strong past-tense action verb, uses the keyword naturally, and ends with a measurable result. Use only the context provided; where a number is missing write [add number]. Never invent employers or facts. Output as: KEYWORD: bullet',`Keywords: ${picked.join(', ')}\nContext: ${ctx||'(none given)'}\nResume excerpt for voice:\n${S.res.slice(0,1500)}`);
      O.innerHTML=txt.split('\n').filter(l=>l.includes(':')).map(l=>{const i=l.indexOf(':');return `<div class="sc-sugg"><b>${E(l.slice(0,i).replace(/^[-*\d.\s]+/,''))}</b><div class="sc-tpl">${E(l.slice(i+1).trim())}</div><button class="sc-mini" onclick="SCUI.append(${JSON.stringify(l.slice(i+1).trim())})">Add to resume</button></div>`;}).join('');
    }catch(e){ O.innerHTML=`<p class="sc-note">AI call failed: ${E(e.message)}</p>`; }
  }
  function append(line){ const ta=S.el.querySelector('#sc-res'); ta.value=ta.value.trimEnd()+'\n- '+line; scan(true); if(S.tab!=='fix'){} }
  async function autoOpt(){
    const O=S.el.querySelector('#sc-auto-out'); O.innerHTML='<p class="sc-note">Rewriting…</p>';
    const bullets=S.res.split('\n').filter(l=>/^\s*[-•▪◦*]/.test(l)).map(l=>l.replace(/^\s*[-•▪◦*]\s*/,''));
    const miss=[...S.report.missing.hard,...S.report.missing.soft].map(x=>x.term).join(', ');
    try{ const txt=await S.ai.run('Rewrite resume bullets to better match a job posting. For each original bullet, return a rewrite that keeps every fact true, opens with a strong action verb, keeps or adds the number, and works in posting keywords ONLY where the original already implies that experience. Return STRICT JSON: [{"o":"original","r":"rewrite","why":"one short line"}] and nothing else.',`POSTING KEYWORDS TO MIRROR (only if true): ${miss}\n\nBULLETS:\n${bullets.map(b=>'- '+b).join('\n')}`);
      const arr=JSON.parse(txt.replace(/```json|```/g,'').trim()); S.fixes=arr;
      O.innerHTML=arr.map((p,i)=>`<div class="sc-diff"><div class="sc-diff-o"><span>Original</span>${E(p.o)}</div><div class="sc-diff-r"><span>Suggested</span>${E(p.r)}<div class="sc-why">${E(p.why||'')}</div></div><div class="sc-diff-a"><button class="sc-mini" onclick="SCUI.accept(${i})">Accept</button><button class="sc-mini sec" onclick="this.closest('.sc-diff').remove()">Skip</button></div></div>`).join('')||'<p class="sc-note">No bullets found to rewrite (start lines with - or •).</p>';
    }catch(e){ O.innerHTML=`<p class="sc-note">Could not parse AI output: ${E(e.message)}</p>`; }
  }
  function accept(i){ const p=S.fixes[i]; if(!p) return; const ta=S.el.querySelector('#sc-res'); ta.value=ta.value.replace(p.o,p.r); const d=S.el.querySelectorAll('.sc-diff')[i]; if(d){d.classList.add('done');} scan(true); }
  return {mount,append,accept};
})();

/* ============================================================
   MARKET, client-side reader.
   Drop into the app. Reads the approved snapshot, caches it,
   and falls back to the built-in defaults if anything is off.
   ============================================================ */
const MARKET = (() => {
  const URL_ = 'https://zwscajqkqjwywqwylhnp.supabase.co';
  const KEY  = 'sb_publishable_NnHD4SNB-l9Naoa1SOomnw_SVo4fFKb';
  const CACHE_KEY = 'bc.market';
  const MAX_AGE_MS = 24 * 60 * 60 * 1000;   // re-check once a day
  const STALE_DAYS = 75;                     // warn if the pipeline stopped

  let data = null, period = null, stale = false;

  async function load(fallback) {
    // 1) cache first, so the UI paints instantly
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && Date.now() - c.at < MAX_AGE_MS) { apply(c.payload); return summary(); }
    } catch (e) { /* ignore */ }

    // 2) fetch the approved snapshot
    try {
      const res = await fetch(
        `${URL_}/rest/v1/market_data?dataset=eq.segments&status=eq.live&select=payload,period,created_at&order=created_at.desc&limit=1`,
        { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (rows?.[0]?.payload) {
        apply(rows[0].payload, rows[0].created_at);
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), payload: rows[0].payload }));
        return summary();
      }
    } catch (e) { /* offline or not set up yet, fall through */ }

    // 3) built-in defaults ship with the app, so it always works
    if (fallback) { data = fallback; period = 'built-in'; }
    return summary();
  }

  function apply(payload, createdAt) {
    data = payload.segments || null;
    period = payload.period || null;
    if (createdAt) stale = (Date.now() - new Date(createdAt)) > STALE_DAYS * 864e5;
  }

  const levels = id => (data && data[id]) || null;
  const headlineFor = () => (data && data.__headline) || null;
  const summary = () => ({ period, stale, ok: !!data });

  /** "Market read: September 2026", always show this in the UI. */
  function stamp() {
    if (!period) return '';
    if (period === 'built-in') return 'Market read: built-in defaults';
    const [y, m] = period.split('-');
    const name = ['January','February','March','April','May','June','July','August','September','October','November','December'][+m - 1];
    return `Market read: ${name || m} ${y}${stale ? ' · may be out of date' : ''}`;
  }

  return { load, levels, stamp, summary, headlineFor };
})();

/* =====================================================================
   BANK, per-user Stories Bank.
   Signed in  → Supabase, row-level-secured to that user. Never shared.
   Signed out → this device only, and the UI says so.
   ===================================================================== */
const BANK=(()=>{
  const URL_='https://zwscajqkqjwywqwylhnp.supabase.co';
  const KEY='sb_publishable_NnHD4SNB-l9Naoa1SOomnw_SVo4fFKb';
  const LS='bc.stories.local';
  let session=null;

  const h=(extra={})=>({apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),'Content-Type':'application/json',...extra});
  const who=()=>session?.user?.email||null;

  async function init(){
    try{ const s=JSON.parse(localStorage.getItem('bc.session')||'null');
      if(s&&s.expires_at*1000>Date.now()){ session=s; }
      else if(s?.refresh_token){ await refresh(s.refresh_token); }
    }catch(e){}
    const qp=new URLSearchParams(location.search);
    if(qp.get('code')){
      try{ const r=await fetch(URL_+'/auth/v1/token?grant_type=pkce',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({auth_code:qp.get('code')})});
        if(r.ok){ const d=await r.json(); session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:d.user}; persist(); history.replaceState(null,'',location.pathname); }
      }catch(e){}
    }
    // magic-link callback lands with tokens in the hash
    if(location.hash.includes('access_token')){
      const p=new URLSearchParams(location.hash.slice(1));
      if(p.get('access_token')){
        session={access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),
          expires_at:Math.floor(Date.now()/1000)+(+p.get('expires_in')||3600),user:null};
        await me(); persist(); history.replaceState(null,'',location.pathname);
      }
    }
    return who();
  }
  function persist(){ try{ localStorage.setItem('bc.session',JSON.stringify(session)); }catch(e){} }
  async function me(){ try{ const r=await fetch(URL_+'/auth/v1/user',{headers:h()}); if(r.ok) session.user=await r.json(); }catch(e){} }
  async function refresh(rt){ try{ const r=await fetch(URL_+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
      if(r.ok){ const d=await r.json(); session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+d.expires_in,user:d.user}; persist(); } }catch(e){} }

  /** Email magic link, no passwords to handle or store. */
  async function signIn(email){
    const r=await fetch(URL_+'/auth/v1/otp',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,create_user:true,options:{email_redirect_to:location.href.split('#')[0]}})});
    if(!r.ok) throw new Error((await r.text()).slice(0,160));
    return true;
  }
  function signOut(){ session=null; try{localStorage.removeItem('bc.session');}catch(e){} }

  const local=()=>{ try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]} };
  const setLocal=a=>{ try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){} };

  async function list(){
    if(!session) return local();
    try{ const r=await fetch(URL_+'/rest/v1/stories?select=*&order=updated_at.desc',{headers:h()});
      if(r.ok) return (await r.json()).map(x=>({...x.payload,__id:x.id}));
    }catch(e){}
    return local();
  }
  async function save(rec){
    if(!session){ const a=local(); const i=a.findIndex(x=>x.title===rec.title); i>=0?a[i]=rec:a.unshift(rec); setLocal(a); return false; }
    try{ const r=await fetch(URL_+'/rest/v1/stories',{method:'POST',headers:h({Prefer:'resolution=merge-duplicates'}),
        body:JSON.stringify({user_id:session.user.id,title:rec.title,payload:rec,updated_at:new Date().toISOString()})});
      if(r.ok) return true;
    }catch(e){}
    const a=local(); a.unshift(rec); setLocal(a); return false;
  }
  async function remove(i){
    if(!session){ const a=local(); a.splice(i,1); setLocal(a); return; }
    const all=await list(); const id=all[i]?.__id; if(!id) return;
    try{ await fetch(URL_+`/rest/v1/stories?id=eq.${id}`,{method:'DELETE',headers:h()}); }catch(e){}
  }
  return {init,signIn,signOut,who,list,save,remove};
})();

/* =====================================================================
   STAR STORY SYSTEM, five sections, live scoring, per-user Stories Bank
   Rubric grounded in: Action ≥50% of answer, 200–250 words / 90–120s,
   ownership ("I" over "we"), quantified results, learnings, recency.
   ===================================================================== */
const STARSYS=(()=>{
  const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;

  const SECTIONS=[
    {k:'s',name:'Situation',weight:15,
     desc:'The context of the story. Where did this occur, when did it happen, and why is it important?',
     probe:['Why is this important? What was the goal?','What was the initial scope? What were the challenges?','What were the risks or consequences if nothing happened?'],
     challenge:['Why did you choose this story to illustrate this competency?','What other stories demonstrate the same thing?','Could you come up with an example that is more recent?'],
     ideal:[25,60],ph:'Q3 2024, our checkout platform was losing customers at payment. Cart abandonment had climbed to 68% and we were bleeding ~$400K a quarter…'},
    {k:'t',name:'Task',weight:15,
     desc:'What you were specifically responsible for. Your remit, not the team\'s.',
     probe:['What exactly were you accountable for?','What was the goal you were given, or set?','What constraints were you working within (time, budget, people)?'],
     challenge:['Was this your mandate, or did you take it on?','Who else could have owned this? Why you?'],
     ideal:[20,50],ph:'I was asked to cut abandonment by 15% in one quarter, with no extra headcount and a frozen roadmap…'},
    {k:'a',name:'Action',weight:35,
     desc:'What you personally did. What did you own, how did you do it, who else was involved?',
     probe:['Were you the key driver or the project owner?','What was your biggest contribution? What unique value did you bring?','What were the most significant obstacles? How did you overcome them?'],
     challenge:['What did you do specifically versus the team?','How did you set priorities, or get manager buy-in?','What decisions did you challenge? How did you influence the outcome?'],
     ideal:[80,150],ph:'I ran a funnel analysis and found 3 drop-off points. I built the business case, pitched it to the VP, negotiated two engineers off another project, and led the redesign myself…'},
    {k:'r',name:'Results',weight:25,
     desc:'How you measured success, and what you achieved. Use numbers.',
     probe:['Why did you focus on these results? What other results mattered?','You mentioned revenue, what percentage change is that year over year?','What trade-offs did you make to achieve this (quality, cost, time)?'],
     challenge:['How did these results compare to your actual goal?','What would you have done differently?','I\'m concerned about the time it took, tell me more.'],
     ideal:[30,70],ph:'Abandonment fell from 68% to 51% in 11 weeks, a 25% relative improvement, ~$1.2M annualized recovery. We shipped 3 weeks early…'},
    {k:'l',name:'Learnings',weight:10,
     desc:'What you took forward. This is what separates a good story from a memorable one.',
     probe:['What did you learn that changed how you work?','What surprised you?','What would you do differently with hindsight?'],
     challenge:['How would you apply this at our company?','If you ran it again tomorrow, what changes?'],
     ideal:[20,50],ph:'I learned to instrument before I optimize. I now insist on funnel telemetry before any redesign, it turned a guess into a diagnosis…'}
  ];

  /* Results taxonomy, the six ways to quantify impact */
  const METRICS=[
    {k:'money',icon:'$',label:'Cost savings / revenue',re:/\$\s?[\d,.]+\s?(k|m|bn|billion|million|thousand)?|\b(revenue|cost savings?|saved|profit|margin|budget|arr|mrr)\b/i},
    {k:'volume',icon:'#',label:'Volume, size, scale',re:/\b\d{2,}(,\d{3})*\b|\b\d+\s?(users?|customers?|people|accounts?|stores?|markets?|teams?|projects?|tickets?)\b/i},
    {k:'percent',icon:'%',label:'Percentage change / YoY',re:/\d+(\.\d+)?\s?%|\bpercent|year[- ]over[- ]year|\byoy\b/i},
    {k:'time',icon:'◷',label:'Time to market / time saved',re:/\b\d+\s?(days?|weeks?|months?|quarters?|hours?|minutes?)\b|\b(ahead of schedule|early|faster|time[- ]to[- ]market|turnaround)\b/i},
    {k:'people',icon:'☺',label:'Customer / team impact',re:/\b(nps|csat|satisfaction|retention|churn|engagement|attrition|morale|adoption|promoted?)\b/i},
    {k:'quality',icon:'✦',label:'Quality improvement',re:/\b(quality|defects?|errors?|bugs?|accuracy|compliance|uptime|sla|incidents?)\b/i}
  ];

  const COMPETENCIES=['Leadership','Problem solving','Conflict / difficult stakeholder','Failure & learning','Influence without authority','Delivery under pressure','Customer focus','Data & analysis','Innovation','Teamwork','Adaptability','Prioritization'];
  const WEAK=/\b(helped|assisted|worked on|was involved|participated|supported|contributed to|responsible for|tasked with|tried to)\b/gi;
  const STRONG=/\b(led|built|launched|drove|delivered|designed|owned|created|reduced|increased|scaled|negotiated|shipped|architected|transformed|streamlined|accelerated|generated|saved|cut|won|secured|initiated|implemented|analyzed|coordinated|influenced|persuaded|rebuilt|redesigned|established|spearheaded)\b/gi;

  /* ---------------- scoring ---------------- */
  function score(v){
    const per={}, flags=[];
    const total=SECTIONS.reduce((n,s)=>n+words(v[s.k]),0);
    const aw=words(v.a), stw=words(v.s)+words(v.t);
    const allText=SECTIONS.map(s=>v[s.k]||'').join(' ');

    SECTIONS.forEach(sec=>{
      const w=words(v[sec.k]); const [lo,hi]=sec.ideal; let pts=0, notes=[];
      if(w===0){ per[sec.k]={pct:0,notes:['Empty, this section is required.'],w}; return; }
      // length fit (40%)
      let len = w<lo*0.5?0.25 : w<lo?0.6 : w<=hi?1 : w<=hi*1.5?0.7 : 0.45;
      if(w<lo) notes.push(`Thin at ${w} words, aim for ${lo}–${hi}.`);
      if(w>hi*1.5) notes.push(`Long at ${w} words, trim toward ${lo}–${hi}.`);
      pts += len*0.4;
      // section-specific quality (60%)
      if(sec.k==='a'){
        const I=(v.a.match(/\bI\b/g)||[]).length, We=(v.a.match(/\bwe\b/gi)||[]).length;
        const own = I===0?0 : I>=We?1 : I/(I+We)*1.4;
        if(I===0) notes.push('No "I", the interviewer cannot tell what YOU did.');
        else if(We>I) notes.push(`"We" (${We}) outnumbers "I" (${I}). Claim your specific contribution.`);
        const verbs=(v.a.match(STRONG)||[]).length;
        if(verbs===0) notes.push('No strong action verbs (led, built, negotiated, drove…).');
        pts += Math.min(1,own)*0.35 + Math.min(1,verbs/3)*0.25;
      } else if(sec.k==='r'){
        const hits=METRICS.filter(m=>m.re.test(v.r));
        if(!hits.length) notes.push('No measurable result. Add at least one: $ · # · % · time · customer impact · quality.');
        else if(hits.length===1) notes.push(`Only one type of measure (${hits[0].label}). Two makes it credible.`);
        pts += Math.min(1,hits.length/2)*0.6;
      } else if(sec.k==='l'){
        const reflective=/\b(learned|learnt|realized|realised|now i|since then|takeaway|differently|changed how|taught me)\b/i.test(v.l);
        if(!reflective) notes.push('Add what changed in how you work, that is the learning.');
        pts += (reflective?1:0.35)*0.6;
      } else {
        const ctx=/\b(19|20)\d{2}\b|\b(q[1-4]|last year|quarter|month|when i was|during)\b/i.test(v[sec.k]);
        if(sec.k==='s'&&!ctx) notes.push('Add when this happened, recency matters to interviewers.');
        const why=/\b(because|so that|goal|risk|target|needed|had to|at stake)\b/i.test(v[sec.k]);
        if(!why) notes.push(sec.k==='s'?'Say why it mattered, the stakes.':'State the goal you were given or set.');
        pts += (ctx?0.3:0)+(why?0.3:0);
      }
      per[sec.k]={pct:Math.round(Math.min(1,pts)*100),notes,w};
    });

    // whole-story checks
    const balance = total? aw/total : 0;
    if(total && balance<0.4) flags.push({t:'warn',m:`Action is ${Math.round(balance*100)}% of your story. Interviewers score the Action, it should be at least 50%. ${stw>aw?'Trim Situation and Task; expand what you did.':'Expand the Action.'}`});
    else if(balance>=0.5) flags.push({t:'ok',m:`Action is ${Math.round(balance*100)}% of the story, right where interviewers want it.`});
    if(total&&total<150) flags.push({t:'warn',m:`${total} words, short. A strong story runs 200–250 words (90–120 seconds aloud).`});
    else if(total>320) flags.push({t:'warn',m:`${total} words, over 2.5 minutes aloud. Trim to 200–250.`});
    else if(total>=180&&total<=300) flags.push({t:'ok',m:`${total} words, about ${Math.round(total/2.2)} seconds aloud. Good length.`});
    const weak=(allText.match(WEAK)||[]);
    if(weak.length) flags.push({t:'warn',m:`${weak.length} weak phrase${weak.length>1?'s':''} (${[...new Set(weak.map(x=>x.toLowerCase()))].slice(0,4).join(', ')}). Replace with what you actually did.`});
    if(!v.title) flags.push({t:'warn',m:'Name the story so you can find it under pressure.'});
    if(!v.comp) flags.push({t:'warn',m:'Tag a competency, that is how one story answers many questions.'});

    const overall=Math.round(SECTIONS.reduce((n,s)=>n+(per[s.k]?.pct||0)*s.weight,0)/100);
    return {overall,per,flags,total,balance,metrics:METRICS.filter(m=>m.re.test(v.r||''))};
  }

  /* ---------------- UI ---------------- */
  let S={};
  function mount(el,opts={}){
    S={el,ai:opts.ai||null,open:'a'};
    el.innerHTML=`<div class="st">
      <div class="st-in glass">
        <div class="f"><label for="st-title">Story name</label><input class="in" id="st-title" placeholder="Turned around the churning enterprise account"></div>
        <div class="f"><label for="st-comp">Competency it proves</label><select class="sel" id="st-comp"><option value="">Choose…</option>${COMPETENCIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div id="st-secs"></div>
        <button class="st-btn" id="st-save">Save to my Stories Bank</button>
        <div id="st-savemsg"></div>
      </div>
      <div class="st-out glass" id="st-out"></div>
    </div>`;
    el.querySelector('#st-secs').innerHTML=SECTIONS.map(sec=>`
      <div class="st-sec" data-sec="${sec.k}">
        <button class="st-sec-h" type="button" data-toggle="${sec.k}" aria-expanded="false">
          <span class="st-sec-name">${sec.name}</span>
          <span class="st-sec-score" id="st-sc-${sec.k}">, </span>
          <span class="car">▸</span>
        </button>
        <div class="st-sec-b">
          <p class="st-sec-desc">${sec.desc}</p>
          <textarea class="ta" id="st-${sec.k}" placeholder="${E(sec.ph)}" aria-label="${sec.name}"></textarea>
          <div class="st-wc"><span id="st-w-${sec.k}">0</span> words · aim ${sec.ideal[0]}–${sec.ideal[1]}</div>
          <details class="st-q"><summary>Probing questions, answer these inside your text</summary><ul>${sec.probe.map(q=>'<li>'+q+'</li>').join('')}</ul></details>
          <details class="st-q ch"><summary>Challenge questions, an interviewer will push here</summary><ul>${sec.challenge.map(q=>'<li>'+q+'</li>').join('')}</ul></details>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.toggle, sec=el.querySelector(`.st-sec[data-sec="${k}"]`);
      const open=sec.classList.toggle('open'); b.setAttribute('aria-expanded',open);
    });
    el.querySelector('.st-sec[data-sec="s"]').classList.add('open');
    el.querySelectorAll('.ta,#st-title,#st-comp').forEach(i=>i.addEventListener('input',live));
    el.querySelector('#st-comp').addEventListener('change',live);
    el.querySelector('#st-save').onclick=save;
    live(); renderBank();
  }
  const vals=()=>({title:S.el.querySelector('#st-title').value.trim(),comp:S.el.querySelector('#st-comp').value,
    ...Object.fromEntries(SECTIONS.map(s=>[s.k,S.el.querySelector('#st-'+s.k).value]))});
  let t=null;
  function live(){ clearTimeout(t); t=setTimeout(()=>{const v=vals();const r=score(v);paint(v,r);},180); }
  function paint(v,r){
    SECTIONS.forEach(sec=>{ const p=r.per[sec.k]||{pct:0,w:0};
      const e=S.el.querySelector('#st-sc-'+sec.k); e.textContent=p.w?p.pct+'%':', ';
      e.className='st-sec-score '+(p.pct>=80?'g':p.pct>=50?'y':p.w?'r':'');
      S.el.querySelector('#st-w-'+sec.k).textContent=p.w; });
    const col=r.overall>=80?'var(--ok)':r.overall>=55?'var(--warn)':'var(--human)';
    const verdict=r.overall>=80?'Interview-ready. This story will hold up to follow-up questions.':r.overall>=55?'Solid draft. Fix the flagged items and it becomes a story you can lean on.':r.total?'Needs work, the gaps below are the ones interviewers probe first.':'Fill in the sections and this scores live.';
    S.el.querySelector('#st-out').innerHTML=`
      <div class="st-gauge-wrap"><div class="st-gauge" style="--pct:${r.overall};--col:${col}"><div class="st-gauge-n">${r.overall}</div><div class="st-gauge-l">story score</div></div>
      <div class="st-bars">${SECTIONS.map(sec=>{const p=r.per[sec.k]||{pct:0};const c=p.pct>=80?'var(--ok)':p.pct>=50?'var(--warn)':'var(--human)';
        return `<div class="st-bar"><span class="st-bar-l">${sec.name} <em>${sec.weight}%</em></span><span class="st-bar-t"><i style="width:${p.pct}%;background:${c}"></i></span><span class="st-bar-n">${p.pct}</span></div>`;}).join('')}</div></div>
      <p class="st-verdict">${verdict}</p>
      <h4 class="st-h">Results measured</h4>
      <div class="st-metrics">${METRICS.map(m=>{const on=r.metrics.some(x=>x.k===m.k);return `<span class="st-metric ${on?'on':''}" title="${m.label}"><b>${m.icon}</b> ${m.label}</span>`;}).join('')}</div>
      ${r.metrics.length<2?'<p class="st-note">Two different measures beat one. A number plus a customer or quality outcome is the most credible pair.</p>':''}
      ${r.flags.length?`<h4 class="st-h">Story-level check</h4>${r.flags.map(f=>`<div class="st-flag ${f.t}">${f.m}</div>`).join('')}`:''}
      <h4 class="st-h">Fix these, section by section</h4>
      ${SECTIONS.map(sec=>{const p=r.per[sec.k];if(!p||!p.notes.length)return '';
        return `<div class="st-fix"><b>${sec.name}</b><ul>${p.notes.map(n=>'<li>'+n+'</li>').join('')}</ul></div>`;}).join('')||'<p class="st-note">Nothing flagged. Read it aloud once and time it.</p>'}
      ${S.ai&&S.ai.ready&&S.ai.ready()?'<button class="st-btn sec" id="st-ai">Ask AI to tighten this story</button><div id="st-aiout"></div>':''}`;
    const ab=S.el.querySelector('#st-ai'); if(ab) ab.onclick=aiTighten;
  }
  async function aiTighten(){
    const o=S.el.querySelector('#st-aiout'); o.innerHTML='<p class="st-note"><span class="spin"></span> Tightening…</p>';
    const v=vals();
    try{ const txt=await S.ai.run('You improve STAR interview stories. Rules: Action must be at least 50% of the words. Use "I" not "we" for the candidate\'s own actions. Keep every fact true, never invent numbers; write [add number] where one is missing. Total 200–250 words. Return the five sections labelled Situation, Task, Action, Results, Learnings, then a short "What I changed" list.',
      `Situation: ${v.s}\nTask: ${v.t}\nAction: ${v.a}\nResults: ${v.r}\nLearnings: ${v.l}`);
      o.innerHTML=`<div class="st-ai">${E(txt).replace(/\n/g,'<br>')}</div>`;
    }catch(e){ o.innerHTML=`<p class="st-note">AI call failed: ${E(e.message)}</p>`; }
  }
  /* ---------------- bank ---------------- */
  async function save(){
    const v=vals(), r=score(v), msg=S.el.querySelector('#st-savemsg');
    if(!v.title){ msg.innerHTML='<div class="st-flag warn">Name the story first.</div>'; return; }
    if(!v.a||!v.r){ msg.innerHTML='<div class="st-flag warn">Action and Results are required before saving.</div>'; return; }
    msg.innerHTML='<p class="st-note"><span class="spin"></span> Saving…</p>';
    const rec={...v,score:r.overall,updated:new Date().toISOString()};
    const ok=await BANK.save(rec);
    msg.innerHTML=ok?`<div class="st-flag ok">Saved to your Stories Bank at ${r.overall}%.</div>`:`<div class="st-flag warn">Saved on this device only, sign in to sync it to your profile.</div>`;
    renderBank();
  }
  async function renderBank(){
    const list=await BANK.list(); const el=S.el.querySelector('#st-out'); if(!el) return;
    const host=document.getElementById('st-bank'); if(!host) return;
    host.innerHTML=list.length?`<h4 class="st-h">Your Stories Bank <span class="st-count">${list.length}</span></h4>
      <p class="st-note">${BANK.who()?'Synced to your profile, private to you.':'On this device. Sign in to sync across devices.'}</p>
      ${list.map((s,i)=>`<div class="st-saved"><div><b>${E(s.title)}</b> ${s.comp?`<span class="st-tag">${E(s.comp)}</span>`:''} <span class="st-tag sc">${s.score||0}%</span><p>${E((s.a||'').slice(0,140))}${(s.a||'').length>140?'…':''}</p></div><div class="st-saved-a"><button class="st-mini" data-load="${i}">Load</button><button class="st-mini sec" data-del="${i}">Delete</button></div></div>`).join('')}
      <div class="st-cov"><b>Coverage:</b> ${COMPETENCIES.filter(c=>list.some(s=>s.comp===c)).length} of ${COMPETENCIES.length} competencies. ${list.length<6?`Aim for 6–10 stories, that covers nearly any behavioral question.`:'Good depth.'}</div>`
      :`<h4 class="st-h">Your Stories Bank</h4><p class="st-note">Empty. Build a story above and save it, aim for 6–10 covering different competencies.</p>`;
    host.querySelectorAll('[data-load]').forEach(b=>b.onclick=async()=>{const s=(await BANK.list())[+b.dataset.load];
      S.el.querySelector('#st-title').value=s.title||''; S.el.querySelector('#st-comp').value=s.comp||'';
      SECTIONS.forEach(x=>S.el.querySelector('#st-'+x.k).value=s[x.k]||'');
      S.el.querySelectorAll('.st-sec').forEach(x=>x.classList.add('open')); live(); window.scrollTo(0,0);});
    host.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this story?'))return; await BANK.remove(+b.dataset.del); renderBank(); });
  }
  return {mount,score,SECTIONS,COMPETENCIES,renderBank};
})();

    'Retail':['Walmart','Target','Costco','Home Depot','Sephora'],
    'Healthcare & pharma':['Johnson & Johnson','Pfizer','CVS Health','UnitedHealth','Abbott']};
  const KEY='bc.store.pyramid'; let S={}; const uid=()=>Math.random().toString(36).slice(2,8);

      <div class="py-body">

  const REJECT=['"we have decided to move forward with other candidates"','"we will not be moving forward"','"unfortunately"','"we regret to inform"','"other candidates whose qualifications"','"pursue other applicants"','"not selected"','"we have filled the position"','"decided not to proceed"'];

  const ATS=['@greenhouse.io','@lever.co','@myworkday.com','@icims.com','@smartrecruiters.com','@ashbyhq.com','@jobvite.com','@taleo.net','@successfactors.com','@bamboohr.com'];

  const STEPS=[

  function insightsHTML(){
    const a=apps(); const n=a.filter(x=>x.stage!=='saved').length;

    const inter=a.filter(x=>LIVE.includes(x.stage)).length; const rate=Math.round(inter/n*100);

    el.querySelectorAll('.tk-st').forEach(s2=>s2.onchange=()=>{const a=apps();a[+s2.dataset.i].stage=s2.value;saveApps(a);render();});

    el.querySelectorAll('.tk-card').forEach(c=>{ c.addEventListener('dragstart',()=>{drag=+c.dataset.i;c.classList.add('dragging');}); c.addEventListener('dragend',()=>c.classList.remove('dragging')); });
    el.querySelectorAll('.tk-col').forEach(z=>{ z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');}); z.addEventListener('dragleave',()=>z.classList.remove('over'));
      z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over'); if(drag==null)return; const a=apps(); a[drag].stage=z.dataset.stage; saveApps(a); drag=null; render();}); });
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const a=apps(); a.splice(+b.dataset.del,1); saveApps(a); render(); });
    const csv=el.querySelector('#t-csv');
    if(csv) csv.onclick=()=>{ const a=apps(); const rows=[['date','company','role','source','stage'],...a.map(x=>[x.d,x.co,x.role,x.src,(STAGES.find(s=>s.id===x.stage)||{}).n])];
      const blob=new Blob([rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
      const u=URL.createObjectURL(blob); const el2=document.createElement('a'); el2.href=u; el2.download='applications.csv'; el2.click(); };
  }
  return {mount};
})();

    ex:'JPMorgan, Goldman, insurers, asset managers, regional banks',watch:'Know which side of the AI line your role sits on: client-facing, risk, and product are safer than back-office processing.'},

    why:'Maximum exposure and learning; billable models mean headcount follows demand.',read:'Stability low–medium · Earn medium–high · Learn high · Hiring varies with client budgets',
    ex:'Big 4, MBB, boutique consultancies, agencies',watch:'Professional services ran one of the higher layoff rates in 2026 (~1.8%). Great Learn-first move; weak Stability move.'},
   {id:'edu',name:'Education, non-profits & foundations',learn:2,earn:1,stab:2,hire:2,
    why:'Mission-driven and slower to cut, with real management and program roles.',read:'Stability medium–high · Earn low · Learn medium · Hiring steady',
    ex:'Universities, foundations, large non-profits, ed-tech (less stable)',watch:'Pay is the trade. If Earn is in your top two, this will frustrate you.'},
   {id:'infra',name:'Infrastructure, construction & advanced manufacturing',learn:2,earn:2,stab:2,hire:3,
    why:'Federal infrastructure and semiconductor investment are driving hiring in project delivery, operations, and supply chain.',read:'Stability medium (cyclical) · Earn medium · Learn medium · Hiring strong',
    ex:'EPC firms, semiconductor fabs, industrial manufacturers, logistics',watch:'Cyclical by nature (construction had the highest monthly layoff rate in mid-2026), but 2026 demand is strong. Project and program managers transfer well.'}
  ];
  const LVL={1:'low',2:'medium',3:'high'};

  let S={}, MK={period:null,stale:false,ok:false};
  /* Overlay the approved monthly snapshot onto the built-in defaults. */
  function applyMarket(){
    SEG.forEach(s=>{ const L=MARKET.levels(s.id); if(!L) return;
      if(Number.isInteger(L.stab)) s.stab=L.stab;
      if(Number.isInteger(L.earn)) s.earn=L.earn;
      if(Number.isInteger(L.learn)) s.learn=L.learn;
      if(Number.isInteger(L.hire)) s.hire=L.hire;
      if(L.why) s.why=L.why; if(L.watch) s.watch=L.watch; });
  }
  function mount(el,opts={}){
    S={el,order:[],persona:opts.persona||'',from:'',saved:null};
    MARKET.load().then(sum=>{ MK=sum; if(sum.ok) applyMarket();
      const b=S.el&&S.el.querySelector('#tri-stamp'); if(b) b.textContent=MARKET.stamp(); });
    try{ S.saved=JSON.parse(localStorage.getItem('bc.store.trifecta')||'null'); }catch(e){}
    if(S.saved&&S.saved.order) S.order=S.saved.order.slice();
    el.innerHTML=`<div class="tri">
      <div class="tri-in glass">
        <h3>Rank what matters most right now</h3>
        <p class="tri-note">Drag the cards into order, or use the arrows. Your #1 shapes where we point you first.</p>
        <div class="tri-rank" id="tri-rank"></div>
        <div class="tri-row"><button class="tri-btn sec" id="tri-clear">Clear ranking</button></div>
        <div class="f" style="margin-top:14px"><label for="tri-sit">Your situation</label><select class="sel" id="tri-sit"><option value="">Choose…</option><option value="scoutp">Employed, exploring passively</option><option value="scouta">Employed, actively looking</option><option value="wanderer">Laid off, open to a new direction</option><option value="sprinter">Laid off, need it fast</option><option value="marathoner">Searching 3+ months</option></select></div>
        <div class="f"><label for="tri-from">Industry you're coming from (optional)</label><select class="sel" id="tri-from"><option value="">Choose…</option><option>Technology / Software</option><option>Consumer Goods (CPG)</option><option>Retail</option><option>Finance</option><option>Healthcare</option><option>Manufacturing</option><option>Media / Entertainment</option><option>Education / Non-profit</option><option>Other</option></select></div>
        <button class="tri-btn" id="tri-run">Show where this points me</button>
      </div>
      <div class="tri-out glass" id="tri-out"><div class="tri-empty">Rank the three cards and pick your situation. You'll get the segments that fit your order, with an honest 2026 read on each, and when in your search to use this.</div></div>
    </div>`;
    if(S.persona) el.querySelector('#tri-sit').value=S.persona;
    renderRank(); wire();
    if(S.saved&&S.saved.order&&S.saved.order.length===3){ el.querySelector('#tri-sit').value=S.saved.sit||S.persona||''; el.querySelector('#tri-from').value=S.saved.from||''; run(); }
  }
  function renderRank(){
    const wrap=S.el.querySelector('#tri-rank');
    const ranked=S.order, pool=Object.keys(P).filter(k=>!ranked.includes(k));
    const card=(k,i,inPool)=>`<div class="tri-card ${inPool?'pool':''}" draggable="true" data-k="${k}" role="listitem" aria-label="${P[k].name}${inPool?'':', rank '+(i+1)}">
        <span class="tri-num">${inPool?'·':i+1}</span>
        <span class="tri-name">${P[k].name}<span class="tri-desc">${P[k].desc}</span></span>
        <span class="tri-ctl">${inPool?`<button class="tri-mini" data-add="${k}" aria-label="Add ${P[k].name} next">＋</button>`:`<button class="tri-mini" data-up="${k}" aria-label="Move up" ${i===0?'disabled':''}>▲</button><button class="tri-mini" data-down="${k}" aria-label="Move down" ${i===ranked.length-1?'disabled':''}>▼</button><button class="tri-mini" data-rm="${k}" aria-label="Remove">✕</button>`}</span>
      </div>`;
    wrap.innerHTML=`<div class="tri-list" role="list" aria-label="Your ranking">${ranked.map((k,i)=>card(k,i,false)).join('')||'<div class="tri-slot">Drag a card here, or tap ＋ to add it in order</div>'}</div>
      ${pool.length?`<div class="tri-poollabel">Not ranked yet</div><div class="tri-list" role="list" aria-label="Unranked">${pool.map(k=>card(k,0,true)).join('')}</div>`:''}`;
    // buttons
    wrap.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.order.push(b.dataset.add);renderRank();});
    wrap.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.order=S.order.filter(x=>x!==b.dataset.rm);renderRank();});
    wrap.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=S.order.indexOf(b.dataset.up);if(i>0){[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];renderRank();}});
    wrap.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=S.order.indexOf(b.dataset.down);if(i<S.order.length-1){[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];renderRank();}});
    // drag & drop (desktop)
    let drag=null;
    wrap.querySelectorAll('.tri-card').forEach(c=>{
      c.addEventListener('dragstart',()=>{drag=c.dataset.k;c.classList.add('dragging');});
      c.addEventListener('dragend',()=>c.classList.remove('dragging'));
      c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('over');});
      c.addEventListener('dragleave',()=>c.classList.remove('over'));
      c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');const tgt=c.dataset.k;if(!drag||drag===tgt)return;
        const o=S.order.filter(x=>x!==drag); const ti=o.indexOf(tgt); if(ti<0) o.push(drag); else o.splice(ti,0,drag); S.order=o; renderRank();});
    });
    const list=wrap.querySelector('.tri-list');
    list.addEventListener('dragover',e=>e.preventDefault());
    list.addEventListener('drop',e=>{ if(drag&&!S.order.includes(drag)){S.order.push(drag);renderRank();} });
  }
  function wire(){
    S.el.querySelector('#tri-clear').onclick=()=>{S.order=[];renderRank();S.el.querySelector('#tri-out').innerHTML='<div class="tri-empty">Cleared. Rank the three cards again.</div>';try{localStorage.removeItem('bc.store.trifecta');}catch(e){}};
    S.el.querySelector('#tri-run').onclick=run;
  }
  function stageFor(sit){ return {scoutp:'targeting',scouta:'targeting',wanderer:'targeting',sprinter:'screening',marathoner:'screening'}[sit]||'targeting'; }
  function run(){
    const out=S.el.querySelector('#tri-out');
    if(S.order.length<3){ out.innerHTML='<div class="tri-empty">Rank all three first, the order is the whole point.</div>'; return; }
    const sit=S.el.querySelector('#tri-sit').value, from=S.el.querySelector('#tri-from').value;
    const [a,b,c]=S.order; const w={[a]:3,[b]:2,[c]:1};
    const urgent=sit==='sprinter'||sit==='marathoner'; const employed=sit==='scoutp'||sit==='scouta';
    const scored=SEG.map(s=>{ let fit=w.learn*s.learn+w.earn*s.earn+w.stability*s.stab; if(urgent) fit+=s.hire; return {...s,fit}; }).sort((x,y)=>y.fit-x.fit);
    const top=scored.slice(0,5), max=urgent?21:18;
    const profile={learn:'Growth-seeker',earn:'Upside-seeker',stability:'Security-first'}[a];
    const stabRank=S.order.indexOf('stability');
    const stabNote=stabRank<=1?`<div class="tri-callout warn"><b>Stability in 2026 is not where it used to be.</b> Big tech had the worst stability of any segment this year, roughly 140–150k cuts in the first half, about half citing AI, with Amazon and Oracle each cutting ~30,000. The stable floor moved to healthcare, government, defense, and regulated energy. Your list below reflects that, not the 2019 map.</div>`:
      `<div class="tri-callout"><b>You ranked Stability last.</b> That opens big tech and AI startups, the highest Earn and Learn in the market, but in 2026 that comes with real layoff exposure. Go in eyes open: negotiate severance terms and keep your network warm from week one.</div>`;
    const urgentNote=urgent?`<div class="tri-callout"><b>Your situation shapes the order.</b> Because you need a job soon, we've weighted segments that are actually hiring in 2026 (healthcare, defense, energy, infrastructure). Your #1 still leads, but a segment that's hiring beats a perfect one that isn't.</div>`:employed?`<div class="tri-callout"><b>You have the rarest asset: time.</b> You can hold out for a role that delivers your top two. Use this ranking to say no to roles that only deliver one.</div>`:'';
    const fromNote=from?`<p class="tri-note">Coming from <b>${E(from)}</b>: segments where your function transfers directly are marked <span class="tri-pill">transfers</span>.</p>`:'';
    const transfers=s=>{ if(!from) return false; const m={'Technology / Software':['bigtech','aistart','finance','health','defense','consult'],'Consumer Goods (CPG)':['cpg','retail','pharma','health'],'Retail':['retail','cpg','health'],'Finance':['finance','pharma','consult','gov'],'Healthcare':['health','pharma','gov'],'Manufacturing':['infra','energy','defense','cpg'],'Media / Entertainment':['consult','retail','cpg'],'Education / Non-profit':['edu','gov','health']}; return (m[from]||[]).includes(s.id); };
    const segCards=top.map((s,i)=>`<div class="tri-seg">
        <div class="tri-seg-h"><span class="tri-seg-n">${i+1}</span><span class="tri-seg-name">${E(s.name)}</span>${transfers(s)?'<span class="tri-pill">transfers</span>':''}<span class="tri-fit" title="Fit with your order">${Math.round(s.fit/max*100)}% fit</span></div>
        <div class="tri-seg-why">${s.why}</div>
        <div class="tri-seg-read"><span class="tri-lvl l${s.stab}">Stability ${LVL[s.stab]}</span><span class="tri-lvl l${s.earn}">Earn ${LVL[s.earn]}</span><span class="tri-lvl l${s.learn}">Learn ${LVL[s.learn]}</span><span class="tri-lvl l${s.hire}">Hiring ${LVL[s.hire]}</span></div>
        <div class="tri-seg-ex"><b>Where to look:</b> ${E(s.ex)}</div>
        <div class="tri-seg-watch"><b>Watch out:</b> ${s.watch}</div>
      </div>`).join('');
    const Q={learn:['"What will I be doing in year two that I can\'t do today?"','"Who on the team has grown into a bigger role, and how?"'],earn:['"What is the approved range, and what separates the bottom of it from the top?"','"How is the bonus actually paid out, target vs. what people got last year?"'],stability:['"How has the team\'s headcount changed in the last 12 months?"','"What happened to this team in the last round of cuts?"']};
    const stage=stageFor(sit);
    out.innerHTML=`
      <div class="tri-profile"><div class="tri-profile-l">Your profile</div><div class="tri-profile-n">${profile}</div><p>You optimize for <b>${P[a].name}</b> first, then <b>${P[b].name}</b>. You'll trade <b>${P[c].name}</b> when you have to. <b>The 2-of-3 rule:</b> any role that delivers your top two is worth a serious look; a role that delivers only one is a pass.</p></div>
      ${stabNote}${urgentNote}
      <h4 class="tri-h">Where this points you</h4>${fromNote}
      <div class="tri-segs">${segCards}</div>
      <h4 class="tri-h">What you're trading</h4>
      <p>By ranking <b>${P[c].name}</b> last you're saying: ${c==='stability'?'you\'ll accept layoff risk for growth or pay, so build a 6-month cushion and never stop networking.':c==='earn'?'you\'ll take less money for growth or security, so know your floor (the number you can\'t go under) before any offer.':'you\'ll take a flatter learning curve for pay or security, so plan your own growth (courses, side projects) because the job won\'t hand it to you.'}</p>
      <h4 class="tri-h">Use this at two moments</h4>
      <div class="tri-journey">
        <div class="tri-step ${stage==='targeting'?'now':''}"><div class="tri-step-t">1 · Targeting <span>${stage==='targeting'?'you are here':''}</span></div><div>Build your target list from the segments above. Filter every posting by your top two, if it can't deliver both, don't apply.</div></div>
        <div class="tri-step ${stage==='screening'?'now':''}"><div class="tri-step-t">2 · Screening <span>${stage==='screening'?'you are here':''}</span></div><div>Verify your priorities in the recruiter and hiring-manager calls. Ask:<ul><li>${Q[a][0]}</li><li>${Q[b][0]}</li></ul></div></div>
        <div class="tri-step"><div class="tri-step-t">3 · Offer</div><div>Score the offer against your order: does it deliver #1? #2? If it only delivers #3, that's the trade you said you wouldn't make. Come back to this tool then.</div></div>
      </div>
      <button class="tri-btn sec" id="tri-save">Save my priorities (feeds Target List & Non-Negotiables)</button>
      <p class="tri-src"><span id="tri-stamp">${MARKET.stamp()||''}</span> ${MK.stale?'<b style="color:var(--warn)">· refresh overdue</b>':''}<br>Reads draw on Challenger, Gray &amp; Christmas monthly cut reports, layoff trackers (H1 2026), and BLS 2024–34 employment projections. Segment-level; verify any specific company before you apply.</p>`;
    out.querySelector('#tri-save').onclick=()=>{ try{ localStorage.setItem('bc.store.trifecta',JSON.stringify({order:S.order,sit,from,top:top.map(s=>s.name),savedAt:Date.now()})); }catch(e){} out.querySelector('#tri-save').textContent='Saved ✓'; };
  }
  return {mount};
})();

function guideFor(t){
  const g=GUIDES[t.id]; if(g&&g.what) return g;
  const inputs=(t.inputs||[]).map(i=>i.label.replace(/\s*\(.*?\)/,'').replace(/\s, .*/,''));
  const drives=(t.drives||[]).map(d=>d.text.replace(/<[^>]+>/g,''));
  return {what:t.desc, get:[t.status==='ai'?'A result generated from your inputs by AI, in seconds':'A result computed from your inputs, instantly',...(drives.length?drives.slice(0,2):[])],
    steps:[inputs.length?'Fill in: '+inputs.slice(0,3).join(', ')+(inputs.length>3?', …':'')+'.':'Open the tool.','Run it.','Act on the result, and come back to re-run as things change.'],example:''};
}
function guideHTML(t){
  const g=guideFor(t); if(!g.what) return '';
  const short=s=>String(s||'').replace(/<[^>]+>/g,'').split(/(?<=[.!?])\s/)[0];
  return `<div class="tg glass">
    <div class="tg-what">${short(g.what)}</div>
    <div class="tg-row">
      ${g.steps.slice(0,3).map((s,i)=>`<div class="tg-step"><span class="tg-n">${i+1}</span><span>${short(s)}</span></div>`).join('')}
    </div>
    ${g.example?`<div class="tg-ex">${g.example.replace(/<[^>]+>/g,'').split(/(?<=[.!?])\s/).slice(0,2).join(' ')}</div>`:''}
  </div>`;
}

function keywords(text,n){
  const t=String(text||'').toLowerCase().replace(/[^a-z0-9+#&/\- ]/g,' ');
  const words=t.split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)&&!/^\d+$/.test(w));
  const c={}; words.forEach(w=>c[w]=(c[w]||0)+1);
  // bigrams
  for(let i=0;i<words.length-1;i++){const b=words[i]+' '+words[i+1]; if(SKILLS.includes(b)||SOFT.includes(b)) c[b]=(c[b]||0)+2;}
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([w,n])=>({w,n}));
}
function skillsIn(text){ const t=String(text||'').toLowerCase(); return SKILLS.filter(s=>t.includes(s)).map(s=>s.replace(/\b\w/g,c=>c.toUpperCase())); }

/* ---- markdown-lite ---- */
function md(s){
  let h=esc(s);
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h4>$1</h4>').replace(/^# (.*)$/gm,'<h4>$1</h4>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  h=h.replace(/^(?:\d+\. .*(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\.\s*/,'')+'</li>').join('')+'</ol>');
  h=h.replace(/^(?:[-•] .*(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^[-•]\s*/,'')+'</li>').join('')+'</ul>');
  h=h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}

/* ---- AI runner: browser key (dev) or proxy (prod) ---- */
const AI={
  ready(){ return !!(this.key||this.endpoint); },
  key:localStorage.getItem('bc.key')||'', model:localStorage.getItem('bc.model')||'claude-sonnet-4-6', endpoint:localStorage.getItem('bc.ep')||'',
  async run(system,user,web){
    const body={model:this.model,max_tokens:2000,system,messages:[{role:'user',content:user}]};
    if(web) body.tools=[{type:'web_search_20250305',name:'web_search'}];
    let res;
    if(this.endpoint){
      res=await fetch(this.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    } else {
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':this.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    }
    if(!res.ok){ const e=await res.text(); throw new Error(res.status+' '+e.slice(0,200)); }
    const data=await res.json();
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }
};

  /* ---------- profile ---------- */

    if(!session) return null;
    try{ const r=await fetch(`${URL_}/rest/v1/profiles?user_id=eq.${session.user.id}&select=*`,{headers:hdr()});

    }

    if(urgent){ base.splice(3,0,{id:'t0',week:1,text:'Reframe: interviewing is a muscle, first reps, not the whole plan',tool:'roadmap_12wk'}); base.forEach(t=>{ if(t.week>2) t.week=Math.max(2,t.week-1); }); }
    if(employed){ base.unshift({id:'t00',week:1,text:'You have time, start your stories while you still have a job',tool:'star'}); }

  /* ---------- auth ---------- */
  /* Real registration: name + email + password. Supabase creates the user immediately. */
  async function signUpPassword(name,em,pw,planChoice){
    if(planChoice) localStorage.setItem('bc.pendingPlan',planChoice);
    if(name) localStorage.setItem('bc.pendingName',name);
    const r=await fetch(URL_+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw,data:{display_name:name},options:{email_redirect_to:location.href.split('#')[0]}})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.msg||d.error_description||d.message||'Could not create the account');
    if(d.access_token){ session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:d.user};
      try{ localStorage.setItem('bc.session',JSON.stringify(session)); }catch(e){} return {signedIn:true}; }
    return {signedIn:false, confirm:true};   // email confirmation required
  }
  async function signInPassword(em,pw){
    const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.msg||d.error_description||'Wrong email or password');
    session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:d.user};
    try{ localStorage.setItem('bc.session',JSON.stringify(session)); }catch(e){}
    return true;
  }
  async function resetPassword(em){
    const r=await fetch(URL_+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,options:{email_redirect_to:location.href.split('#')[0]}})});
    if(!r.ok) throw new Error('Could not send the reset email'); return true;
  }
  async function sendLink(em,planChoice){
    if(planChoice) localStorage.setItem('bc.pendingPlan',planChoice);
    const r=await fetch(URL_+'/auth/v1/otp',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},

  function signOut(){ BANK.signOut(); session=null; profile=null; viewAs={plan:null,persona:null}; go('/'); }

  const go=path=>{ if(location.hash==='#'+path) route(); else location.hash='#'+path; };

    const h=(location.hash||'#/').replace(/^#/,''); const [path,q]=h.split('?'); const qs=new URLSearchParams(q||'');
    const authed=!!session;
    const setNav=(on)=>{ document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('on',a.dataset.route===on)); };
    document.getElementById('tabbar').style.display=authed?'':'none';

      ?`<a href="#/dashboard" data-route="/dashboard">Home</a><a href="#/tools" data-route="/tools">Tools</a><a href="#/pricing" data-route="/pricing">Plans</a><a href="#/profile" data-route="/profile">Profile</a>`
      :`<a href="https://boldrcareers.com/" data-route="/home">Home</a><a href="https://boldrcareers.com/product.html">What you get</a><a href="#/pricing" data-route="/pricing">Plans</a><a href="https://boldrcareers.com/about.html">Who we are</a>`;
    document.getElementById('navCta').innerHTML=authed?`<span class="planbadge pb-${plan()}">${PLANS[plan()].name}</span>`:`<a class="btn sm sec" href="#/signin">Sign in</a><a class="btn sm" href="#/signup">Sign up</a>`;
    renderAdminBar();
    const P=document.getElementById('page'); const T=document.getElementById('toolsHost');
    T.style.display='none'; P.style.display='';
    if(authed && profile){
      const chose = !!(profile.prefs && profile.prefs.plan_chosen);
      const exempt = ['/plan','/onboarding','/profile','/pricing','/checkout','/tools','/reset'].includes(path);
      if(!chose && !exempt && path!=='/'){ return go('/plan'); }
      if(chose && !profile.persona && !exempt && path!=='/'){ return go('/onboarding'); }
    }
    setNav(path);
    switch(path){
      case '/': return authed?go('/dashboard'):go('/signup');
      case '/pricing': return pagePricing(P);
      case '/signup': return pageAuth(P,'signup',qs.get('plan'));
      case '/signin': return pageAuth(P,'signin');
      case '/forgot': return pageForgot(P);
      case '/reset': return pageReset(P);
      case '/plan': return authed?pagePickPlan(P):go('/signup');
      case '/checkout': return pageCheckout(P,qs.get('plan')||'paid');
      case '/onboarding': return pageOnboarding(P);
      case '/dashboard': return authed?pageDashboard(P):go('/signin');
      case '/tools': if(!authed) return go('/signin'); P.style.display='none'; T.style.display=''; return pageTools(qs.get('open'));
      case '/profile': return authed?pageProfile(P):go('/signin');
      default: return go('/');
    }
  }

      <p class="lede" style="font-size:13px;color:var(--ink-3)">Prices are launch period. Credits reset on the 1st. Cancel any time, no call and no retention script.</p>`;
  }
  /* ---------- AUTH: tabbed sign up / sign in, real registration ---------- */
  function pageAuth(P,mode,pre){
    const up=mode!=='signin';
    P.innerHTML=`<div class="auth">
      <div class="card glass authcard">
        <div class="authtabs" role="tablist">
          <button class="authtab ${up?'on':''}" role="tab" aria-selected="${up}" onclick="location.hash='#/signup'">Sign up</button>
          <button class="authtab ${up?'':'on'}" role="tab" aria-selected="${!up}" onclick="location.hash='#/signin'">Sign in</button>
        </div>
        ${up?`<div class="steps"><span class="stepdot on">1</span><i></i><span class="stepdot">2</span><i></i><span class="stepdot">3</span></div>
             <div class="stepcap">Step 1 of 3 · Create your account</div>`:''}
        <h1 class="authh1">${up?'Create your account.':'Welcome back.'}</h1>
        <p class="authsub">${up?'Takes about 30 seconds. No card needed, you pick a plan next.':'Sign in to pick up where you left off.'}</p>
        ${up?`<div class="f"><label for="au-name">First name</label><input class="in" id="au-name" placeholder="Bruno" autocomplete="given-name"></div>`:''}
        <div class="f"><label for="au-em">Email</label><input class="in" id="au-em" type="email" placeholder="you@email.com" autocomplete="email" inputmode="email"></div>
        <div class="f"><label for="au-pw">Password</label><input class="in" id="au-pw" type="password" placeholder="${up?'At least 8 characters':'Your password'}" autocomplete="${up?'new-password':'current-password'}">
          ${up?'<div class="pwbar"><i id="au-pwbar"></i></div><div class="hint" id="au-pwhint">Use 8 or more characters.</div>':'<div class="hint"><a href="#/forgot" style="color:var(--accent)">Forgot your password?</a></div>'}</div>
        <button class="btn" style="width:100%" id="au-go">${up?'Create account →':'Sign in'}</button>
        <div class="ordiv"><span>or</span></div>
        <button class="btn sec" style="width:100%" id="au-link">Email me a sign-in link instead</button>
        <div id="au-msg"></div>
        <p class="authfoot">${up?`By creating an account you agree to our terms. Already have one? <a href="#/signin">Sign in</a>`:`New here? <a href="#/signup">Create an account</a>`}</p>
      </div></div>`;
    const q=x=>P.querySelector(x);
    if(up){ q('#au-pw').addEventListener('input',e=>{ const v=e.target.value; const sc=Math.min(4,(v.length>=8?1:0)+(/[A-Z]/.test(v)?1:0)+(/\d/.test(v)?1:0)+(/[^A-Za-z0-9]/.test(v)?1:0));
      q('#au-pwbar').style.width=(sc/4*100)+'%'; q('#au-pwbar').style.background=sc<2?'var(--human)':sc<3?'var(--warn)':'var(--ok)';
      q('#au-pwhint').textContent=v.length<8?'Use 8 or more characters.':sc<3?'Add a number or capital letter to strengthen it.':'Strong password.'; }); }
    const msg=(t,cls='')=>q('#au-msg').innerHTML=`<div class="msg ${cls}">${t}</div>`;
    q('#au-go').onclick=async()=>{
      const em=q('#au-em').value.trim(), pw=q('#au-pw').value;
      if(!em||!pw) return msg('Enter your email and password.','warn');

      }catch(e){ msg(E(e.message),'warn'); }
      q('#au-go').disabled=false;

    q('#au-link').onclick=async()=>{ const em=q('#au-em').value.trim(); if(!em) return msg('Enter your email first.','warn');
      msg('Sending…'); try{ await sendLink(em,pre||null); msg(`Check your inbox, a sign-in link is on its way to <b>${E(em)}</b>.`,'ok'); }catch(e){ msg(E(e.message),'warn'); } };
    [q('#au-em'),q('#au-pw')].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') q('#au-go').click(); }));
  }
  function pageForgot(P){
    P.innerHTML=`<div class="auth"><div class="card glass authcard"><h1 class="authh1">Reset your password.</h1>

  /* Set a new password after clicking a recovery link */
  function pageReset(P){
    P.innerHTML=`<div class="auth"><div class="card glass authcard">
      <h1 class="authh1">Set a new <em>password</em>.</h1>
      <p class="authsub">Choose a new password for your account. You'll be signed in right after.</p>
      <div class="f"><label for="rs-pw">New password</label><input class="in" id="rs-pw" type="password" placeholder="At least 8 characters" autocomplete="new-password">
        <div class="pwbar"><i id="rs-bar"></i></div><div class="hint" id="rs-hint">Use 8 or more characters.</div></div>
      <div class="f"><label for="rs-pw2">Confirm new password</label><input class="in" id="rs-pw2" type="password" autocomplete="new-password"></div>

      <div id="rs-msg"></div>

    const q=x=>P.querySelector(x), msg=(t,c='')=>q('#rs-msg').innerHTML=`<div class="msg ${c}">${t}</div>`;
    if(!recoveryToken && !pendingCode && !session){ msg('This reset link is missing or expired. Request a new one from <a href="#/forgot" style="color:var(--accent)">Forgot password</a>.','warn'); }
    q('#rs-pw').addEventListener('input',e=>{ const v=e.target.value; const sc=Math.min(4,(v.length>=8?1:0)+(/[A-Z]/.test(v)?1:0)+(/\d/.test(v)?1:0)+(/[^A-Za-z0-9]/.test(v)?1:0));
      q('#rs-bar').style.width=(sc/4*100)+'%'; q('#rs-bar').style.background=sc<2?'var(--human)':sc<3?'var(--warn)':'var(--ok)';
      q('#rs-hint').textContent=v.length<8?'Use 8 or more characters.':sc<3?'Add a number or capital letter.':'Strong password.'; });
    q('#rs-go').onclick=async()=>{
      const pw=q('#rs-pw').value, pw2=q('#rs-pw2').value;
      if(pw.length<8) return msg('Password needs at least 8 characters.','warn');
      if(pw!==pw2) return msg('The two passwords do not match.','warn');
      q('#rs-go').disabled=true; msg('Saving…');
      try{
        let tok=recoveryToken||(session&&session.access_token);
        if(!tok && pendingCode){
          const r0=await fetch(URL_+'/auth/v1/token?grant_type=pkce',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({auth_code:pendingCode})});
          if(r0.ok){ const d0=await r0.json(); tok=d0.access_token; session={access_token:d0.access_token,refresh_token:d0.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d0.expires_in||3600),user:d0.user}; try{localStorage.setItem('bc.session',JSON.stringify(session));}catch(e){} }
        }
        if(!tok) throw new Error('This reset link is no longer valid. Request a new one.');
        const r=await fetch(URL_+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        const d=await r.json();
        if(!r.ok) throw new Error(d.msg||d.message||'Could not update the password');
        if(recoveryToken){ session={access_token:recoveryToken,refresh_token:'',expires_at:Math.floor(Date.now()/1000)+3600,user:d}; try{localStorage.setItem('bc.session',JSON.stringify(session));}catch(e){} }
        recoveryToken=null; pendingCode=null;
        msg('Password updated. Taking you in…','ok');
        await loadProfile();
        setTimeout(()=>go(!(profile&&profile.prefs&&profile.prefs.plan_chosen)?'/plan':(profile&&profile.persona?'/dashboard':'/onboarding')),800);
      }catch(e){ msg(E(e.message),'warn'); q('#rs-go').disabled=false; }
    };
  }

  /* ---------- Real multi-step intake, every step required, no skipping ---------- */
  /* ==================================================================

     Machine's DATA object (fork → branches → shared). Every question

     ================================================================== */
  const BRANCH_Q={
    scoutp:[{q:'Why are you job searching?',opts:['I want more growth','I\'m bored / stagnated, no or limited career trajectory','I\'m ready for a change, too long in the same role/company','I want better pay','I want a better environment, culture / colleagues / management','Other'],open:true},
            {q:'How actively are you looking?',opts:['Haven\'t started, first time thinking about my search','Passively / casually','Building momentum','Urgently, I\'d like a job ASAP','Other'],open:true}],
    scouta:[{q:'Why are you job searching?',opts:['I want more growth','I\'m bored / stagnated, no or limited career trajectory','I\'m ready for a change, too long in the same role/company','I want better pay','I want a better environment, culture / colleagues / management','Other'],open:true},
            {q:'How actively are you looking?',opts:['Haven\'t started, first time thinking about my search','Passively / casually','Building momentum','Urgently, I\'d like a job ASAP','Other'],open:true}],
    wanderer:[{q:'How open are you to something new?',opts:['Stay in my lane, same kind of role','Somewhat open, a related field could work','Wide open, ready to reimagine what I do']},
              {q:'Your last role, how did it feel?',opts:['Loved most of it','Mixed','Ready to move on']}],
