    if(/not allowed/i.test(e.message)) return gate('This account is not an admin.','<p class="note">Add the email to the <code>admins</code> table in Supabase, then refresh.</p>');

function statusBars(bs,total){ const order=['new','active','at risk','quiet','churned','never started']; const col={new:'#FCD409',active:'#22834D','at risk':'#F47F20',quiet:'#ADA150',churned:'#CE3520','never started':'#8d7d76'}; total=total||1;

function sparkline(rows){ if(!rows.length) return '<p class="empty">No sign-ups in the last 30 days.</p>'; const by={}; rows.forEach(r=>by[r.day]=+r.n); const days=[]; for(let i=29;i>=0;i--){ const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10); days.push({day:d,n:by[d]||0}); }

const COLS=[['email','Person'],['status','Status'],['plan','Plan'],['step_reached','Step',1],['credits_used','Credits',1],['free_calls','Free calls',1],['cost_total','AI cost',1],['cost_30d','Cost 30d',1],['minutes','Time with it',1],['sessions','Visits',1],['active_days','Active days',1],['days_with_us','Days with us',1],['last_seen','Last seen'],['jobs','Jobs',1],['interviews','Interviews',1],['stories','Stories',1],['utm_source','Source']];

  const {k,dir}=state.sort; rows=rows.slice().sort((a,b)=>{const x=a[k],y=b[k]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x>y?1:x<y?-1:0)*dir;});

function exportCsv(rows){ const cols=['email','display_name','status','plan','plan_since','step_reached','credits_used','credits_granted','free_calls','calls','cost_total','cost_30d','minutes','sessions','active_days','days_with_us','created_at','last_seen','last_ai_at','jobs','applied','interviews','offers','scans','stories','resumes','feedback','open_questions','utm_source','utm_medium','utm_campaign','landing_page','notes']; const esc=v=>'"'+String(Array.isArray(v)?v.join(' '):(v??'')).replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(k=>esc(r[k])).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='boldr-people-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); }

async function openPerson(id){ const p=state.people.find(x=>x.user_id===id); if(!p) return;
  const head=`<button class="x" id="dx" aria-label="Close">×</button>
    <div class="eb">${E(p.status)} · ${PLAN_NAME[p.plan]||E(p.plan)} since ${day(p.plan_since)}</div>
    <h1 style="font-size:24px;margin:4px 0 2px">${E(p.display_name||p.email)}</h1><p class="note" style="margin:0 0 14px">${E(p.email)} · joined ${day(p.created_at)}, ${p.days_with_us} days with us · last seen ${ago(p.last_seen)}${p.deletion_requested_at?' · <b class="bad">asked to delete the account '+day(p.deletion_requested_at)+'</b>':''}</p>
    <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      <div class="tile" style="--c:#079EB0"><div class="k">Credits</div><div class="v" style="font-size:24px">${p.credits_used}<span class="muted" style="font-size:14px"> of ${p.credits_granted}</span></div><div class="s">${p.credits_month} this month</div></div>
      <div class="tile" style="--c:#ADA150"><div class="k">Free calls</div><div class="v" style="font-size:24px">${p.free_calls}</div><div class="s">scans, in-job edits, reads</div></div>
      <div class="tile" style="--c:#3560B0"><div class="k">AI cost</div><div class="v" style="font-size:24px">${cents(p.cost_total)}</div><div class="s">${cents(p.cost_30d)} in 30 days</div></div>
      <div class="tile" style="--c:#22834D"><div class="k">Time with it</div><div class="v" style="font-size:24px">${mins(p.minutes)}</div><div class="s">${p.sessions} visits · ${p.active_days} active days</div></div>
      <div class="tile" style="--c:${STEP_COL[p.step_reached]||'#ccc'}"><div class="k">Step reached</div><div class="v" style="font-size:24px">${p.step_reached||'—'}</div><div class="s">${E(STEP_NAME[p.step_reached])}</div></div>
      <div class="tile" style="--c:#F47F20"><div class="k">Jobs</div><div class="v" style="font-size:24px">${p.jobs}</div><div class="s">${p.applied} applied · ${p.interviews} interviews · ${p.offers} offers</div></div>
    </div>
    <div class="kv"><b>Signed in with</b><span>${E(p.provider||'—')}</span><b>Last sign in</b><span>${ago(p.last_sign_in)}</span><b>Last AI call</b><span>${ago(p.last_ai_at)}</span><b>Persona</b><span>${E(p.persona||'—')}</span>
      <b>Content</b><span>${p.stories} stories · ${p.resumes} resumes · ${p.scans} scans · best score ${p.best_score??'—'}</span>
      <b>Feedback</b><span>${p.feedback} in all · ${p.helpful_yes} helped · ${p.helpful_no} did not · ${p.open_questions} open question${p.open_questions===1?'':'s'}</span>
      <b>Money</b><span>${money(p.paid_total)} paid · ${money(p.mrr)} a month (zero until Stripe)</span>
      <b>Came from</b><span>${E(p.utm_source||'direct')}${p.utm_medium?' / '+E(p.utm_medium):''}${p.utm_campaign?' / '+E(p.utm_campaign):''}</span><b>Landing page</b><span>${E(p.landing_page||'—')}</span></div>
    <h3>Notes and flags</h3>
    <input id="flags" style="width:100%;margin-bottom:8px" placeholder="flags, comma separated: tester, friend, vip, refund-risk" value="${E((p.flags||[]).join(', '))}">
    <textarea id="note" style="width:100%;min-height:90px" placeholder="Anything you or Michelle should remember about this person.">${E(p.notes||'')}</textarea>
    <div class="bar" style="margin-top:8px"><button class="b" id="save">Save</button><span class="note" id="savemsg"></span></div>
    <div id="pdetail"><p class="empty">Loading the timeline…</p></div>
    <p class="note" style="margin-top:20px">Story text, resume files and intake answers are not shown here on purpose. Counts only.</p>`;
  $('#panel').innerHTML=head; $('#drawer').classList.add('on'); $('#dx').onclick=()=>$('#drawer').classList.remove('on');
  $('#save').onclick=async()=>{ const flags=$('#flags').value.split(',').map(s=>s.trim()).filter(Boolean); const note=$('#note').value;
    try{ await rpc('ops_set_note',{target:id,note,new_flags:flags}); p.notes=note; p.flags=flags; $('#savemsg').textContent='Saved.'; }catch(e){ $('#savemsg').textContent='Could not save: '+e.message; } };
  try{ const d=await rpc('ops_person_v2',{p_user:id});
    $('#pdetail').innerHTML=`
      ${d.by_month.length?`<h3>Credits and cost by month</h3><div class="tw"><table><thead><tr><th>Month</th><th class="num">Charged</th><th class="num">Free</th><th class="num">Cost</th></tr></thead><tbody>${d.by_month.map(m=>`<tr><td>${m.month}</td><td class="num">${m.charged}</td><td class="num">${m.free}</td><td class="num">${cents(m.cost)}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${d.by_tool.length?`<h3>By tool</h3><div class="tw"><table><thead><tr><th>Tool</th><th class="num">Calls</th><th class="num">Charged</th><th class="num">Cost</th></tr></thead><tbody>${d.by_tool.map(t=>`<tr><td>${E(toolName(t.tool_id))}</td><td class="num">${t.calls}</td><td class="num">${t.charged}</td><td class="num">${cents(t.cost)}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${d.jobs.length?`<h3>Their jobs</h3><div class="tw"><table><thead><tr><th>Job</th><th>Stage</th><th class="num">Score</th><th class="num">Scans</th><th>Updated</th></tr></thead><tbody>${d.jobs.map(j=>`<tr><td><b>${E(j.role||'')}</b><span class="note" style="display:block">${E(j.company||'')}</span></td><td><span class="pill">${E(j.stage||'')}</span></td><td class="num">${j.score??'—'}</td><td class="num">${j.scans||0}</td><td>${day(j.updated_at)}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${d.feedback.length?`<h3>What they told us</h3><ul class="tl">${d.feedback.map(f=>`<li><span>${when(f.at)}<small style="display:block">${E(toolName(f.tool_id))}</small></span><span>${f.kind==='rating'?(f.helpful?'<span class="ok">It helped</span>':'<span class="bad">It did not help</span>'):'<span class="pill">'+E(f.status)+'</span>'} ${f.text?E(f.text):''}</span></li>`).join('')}</ul>`:''}
      <h3>Days with us <span class="note">what they did each day</span></h3>${d.days.length?`<ul class="tl">${d.days.slice(0,30).map(x=>`<li><span>${day(x.day)}<small style="display:block">${x.events} events</small></span><span class="note">${E(x.names||'')}</span></li>`).join('')}</ul>`:'<p class="empty">No events recorded yet.</p>'}
      <h3>Last AI calls</h3>${d.usage.length?`<ul class="tl">${d.usage.slice(0,40).map(u=>`<li><span>${when(u.at)}<small style="display:block">${E(u.model||'')}</small></span><span><span class="pill k-${E(u.kind)}">${E(KIND_NAME[u.kind]||u.kind)}</span> ${E(toolName(u.tool_id))} <span class="muted">${cents(u.cost)}</span></span></li>`).join('')}</ul>`:'<p class="empty">No AI calls yet.</p>'}`;
  }catch(e){ $('#pdetail').innerHTML='<p class="note bad">Could not load the timeline: '+E(e.message)+'</p>'; }
}
$('#drawer').addEventListener('click',e=>{ if(e.target===$('#drawer')) $('#drawer').classList.remove('on'); });

/* ---------------- Usage and cost ---------------- */
function usage(){ const s=state.ov||{}; const P=state.people;
  const byPlan=['basic','paid','premium'].map(k=>{ const rows=P.filter(p=>p.plan===k); return {k,n:rows.length,cost30:rows.reduce((a,p)=>a+(+p.cost_30d||0),0),costAll:rows.reduce((a,p)=>a+(+p.cost_total||0),0),credits:rows.reduce((a,p)=>a+(+p.credits_used||0),0),free:rows.reduce((a,p)=>a+(+p.free_calls||0),0),list:(PRICE[k]||0)*rows.length}; });
  const kinds=Object.entries(s.by_kind_30d||{}).sort((a,b)=>b[1].calls-a[1].calls), models=Object.entries(s.by_model_30d||{}).sort((a,b)=>b[1].cost-a[1].cost);
  setTimeout(()=>{ const sel=$('#days'); if(sel) sel.onchange=e=>{state.days=+e.target.value;render();}; $$('tr.row').forEach(tr=>tr.onclick=()=>openPerson(tr.dataset.id)); },0);
  return `<div class="sh"><div><h1>Usage and cost</h1><p class="sub">Every AI call we pay for, by day, tool, kind, model and plan.</p></div></div>
  <div class="card"><h2>AI calls, last 30 days</h2>${dailyChart(s.daily||[])}</div>
  <div class="grid2">
    <div class="card"><h2>By kind, 30 days <span>what charges a credit and what does not</span></h2><div class="tw"><table><thead><tr><th>Kind</th><th class="num">Calls</th><th class="num">Cost</th><th class="num">Per call</th></tr></thead><tbody>${kinds.map(([k,v])=>`<tr><td><span class="pill k-${E(k)}">${E(KIND_NAME[k]||k)}</span></td><td class="num">${num(v.calls)}</td><td class="num">${money(v.cost)}</td><td class="num">${v.calls?cents(v.cost/v.calls):'—'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nothing in 30 days.</td></tr>'}</tbody></table></div>
      <p class="defs" style="margin:10px 0 0">Only <b>charged credit</b> rows count against a plan. The scan in Job Match Score, the edits inside a job that already used a credit (up to 30), and the Career Report twice a month are free to the person and paid by us.</p></div>
    <div class="card"><h2>By model, 30 days</h2><div class="tw"><table><thead><tr><th>Model</th><th class="num">Calls</th><th class="num">Tokens in</th><th class="num">Tokens out</th><th class="num">Cost</th></tr></thead><tbody>${models.map(([k,v])=>`<tr><td>${E(k)}</td><td class="num">${num(v.calls)}</td><td class="num">${num(v.in_tokens)}</td><td class="num">${num(v.out_tokens)}</td><td class="num">${money(v.cost)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing yet.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>By plan <span>cost against what the plan would pay</span></h2><div class="tw"><table><thead><tr><th>Plan</th><th class="num">People</th><th class="num">Credits used</th><th class="num">Free calls</th><th class="num">Cost 30d</th><th class="num">Cost all time</th><th class="num">List, a month</th><th class="num">Margin at list</th></tr></thead><tbody>${byPlan.map(t=>`<tr><td><span class="pill ${t.k}">${PLAN_NAME[t.k]}</span></td><td class="num">${t.n}</td><td class="num">${num(t.credits)}</td><td class="num">${num(t.free)}</td><td class="num">${money(t.cost30)}</td><td class="num">${money(t.costAll)}</td><td class="num">${money(t.list)}</td><td class="num ${t.list-t.cost30<0?'bad':'ok'}">${money(t.list-t.cost30)}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin:10px 0 0">List is what the plan would collect if every account on it paid. Real revenue is zero until Stripe.</p></div>
    <div class="card"><h2>Who costs the most <span>all time</span></h2><div class="tw"><table><thead><tr><th>Person</th><th>Plan</th><th class="num">Credits</th><th class="num">Free</th><th class="num">Cost</th></tr></thead><tbody>${P.slice().sort((a,b)=>b.cost_total-a.cost_total).slice(0,10).map(p=>`<tr class="row" data-id="${p.user_id}"><td>${E(p.display_name||p.email)}</td><td><span class="pill ${E(p.plan)}">${PLAN_NAME[p.plan]}</span></td><td class="num">${p.credits_used}</td><td class="num">${p.free_calls}</td><td class="num">${cents(p.cost_total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No AI calls yet.</td></tr>'}</tbody></table></div></div>
  </div>
  <div class="card"><div class="bar"><h2 style="margin:0">By tool, last <select id="days" aria-label="Days">${[7,30,90,365].map(d=>`<option ${state.days===d?'selected':''}>${d}</option>`).join('')}</select> days</h2></div><div id="tools" class="empty">Loading…</div></div>`; }

/* ---------------- Funnel ---------------- */
function funnel(){ return `<div class="sh"><div><h1>Funnel</h1><p class="sub">From a visit on the marketing pages to a paying customer.</p></div></div>
  <div class="grid2"><div class="card"><div class="bar"><h2 style="margin:0">Last <select id="fdays" aria-label="Days">${[7,30,90].map(d=>`<option ${state.days===d?'selected':''}>${d}</option>`).join('')}</select> days</h2></div><div id="fun" class="empty">Loading…</div></div>
  <div class="card"><h2>Where people come from <span>landing page and source</span></h2><div id="src" class="empty">Loading…</div><p class="note" style="margin:10px 0 0">Landing page is the first page someone opened. Source is the utm_source on that first visit; direct means none.</p></div></div>`; }

var loadExtra=async function(t){
  try{
    if(t==='overview'){
      const el=$('#ovchart'); if(el){ el.className=''; el.innerHTML=dailyChart((state.ov||{}).daily||[]); }
      const rows=await rpc('ops_pipeline').catch(()=>[]); const tot=rows.reduce((a,r)=>a+r.n,0)||1; const SC={saved:'#B9AFA6',scored:'#079EB0',applied:'#F47F20',screen:'#3560B0',interview:'#3560B0',interviewing:'#3560B0',offer:'#22834D',closed:'#CE3520',rejected:'#CE3520'};
      const pe=$('#pipe'); if(pe){ pe.className='funnel'; pe.innerHTML=rows.length?rows.map(r=>`<div class="fstep"><b>${E(r.stage)}</b><div class="fbar"><i style="width:${Math.max(2,r.n/tot*100)}%;background:${SC[r.stage]||'#3560B0'}"></i></div><b class="num">${r.n}</b><span class="note">${r.people} ${r.people===1?'person':'people'}</span></div>`).join(''):'<p class="empty">No jobs on any board yet.</p>'; }
    }
    if(t==='usage'){
      const tools=await rpc('ops_tools_v2',{days:state.days});
      $('#tools').className=''; $('#tools').innerHTML=tools.length?`<div class="tw"><table><thead><tr><th>Tool</th><th class="num">Opens</th><th class="num">People who opened</th><th class="num">Calls</th><th class="num">Charged</th><th class="num">Free</th><th class="num">People who ran</th><th class="num">Cost</th><th class="num">Per call</th><th class="num">Helped / not</th><th>Last run</th></tr></thead><tbody>${tools.map(x=>`<tr><td><b>${E(toolName(x.tool_id))}</b><span class="note" style="display:block">${E(x.tool_id)}</span></td><td class="num">${x.opens}</td><td class="num">${x.openers}</td><td class="num">${x.calls}</td><td class="num">${x.charged}</td><td class="num">${x.free}</td><td class="num">${x.people}</td><td class="num">${money(x.cost)}</td><td class="num">${x.calls?cents(x.cost/x.calls):'—'}</td><td class="num"><span class="ok">${x.helpful_yes}</span> / <span class="bad">${x.helpful_no}</span></td><td>${x.last_at?ago(x.last_at):'—'}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin:10px 0 0">Opens come from the app's events; calls and cost from the server's usage rows. A tool many people open and few run is one people do not understand.</p>`:'<p class="empty">No runs in this window.</p>';
    }
    if(t==='funnel'){
      const sel=$('#fdays'); if(sel) sel.onchange=e=>{state.days=+e.target.value;render();};
      const [f,src]=await Promise.all([rpc('ops_funnel',{days:state.days}),rpc('ops_sources',{days:state.days})]);
      const top=Math.max(1,f[0]?f[0].n:1);
      $('#fun').className='funnel'; $('#fun').innerHTML=f.map((s,i)=>{const prev=i?f[i-1].n:s.n; const conv=prev?Math.round(s.n/prev*100):0; return `<div class="fstep"><b>${E(s.step)}</b><div class="fbar"><i style="width:${Math.max(2,s.n/top*100)}%"></i></div><b class="num">${s.n}</b><span class="note">${i?conv+'%':''}</span></div>`;}).join('')+`<p class="note" style="margin:10px 0 0">Visitors counts distinct browsers on the marketing pages. Each percentage is conversion from the step above. Paid is zero until Stripe.</p>`;
      $('#src').className=''; $('#src').innerHTML=src.length?`<div class="tw"><table><thead><tr><th>Landing page</th><th>Source</th><th class="num">Visits</th><th class="num">Sign-ups</th><th class="num">Conv.</th></tr></thead><tbody>${src.map(x=>`<tr><td>${E(x.landing_page)}</td><td>${E(x.utm_source)}</td><td class="num">${x.visits}</td><td class="num">${x.signups}</td><td class="num">${x.visits?Math.round(x.signups/x.visits*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No visits recorded yet.</p>';
    }
  }catch(e){ ['#ovchart','#pipe','#tools','#fun','#src'].forEach(s=>{const el=$(s); if(el&&/Loading/.test(el.textContent)) el.innerHTML='<span class="bad">'+E(e.message)+'</span>';}); }
}

/* ---------------- Feedback ---------------- */
const FB_STATUS=['new','answered','fixed','closed'];
function feedback(){ return `<div class="sh"><div><h1>Feedback</h1><p class="sub">Did this help, and Stuck? Ask us. Plus the silent signal: tools people open and never run.</p></div></div>
  <div class="card"><div class="bar"><div id="fbfilters" class="filters"></div></div><div id="fbk" class="empty">Loading…</div></div>
  <div class="card"><h2>Opened and never ran <span>last 30 days</span></h2><div id="fbab" class="empty">Loading…</div><p class="note" style="margin:10px 0 0">Nobody was asked anything. A tool many people open and few run is one people do not understand how to use.</p></div>`; }
async function loadFeedback(){
  const q=state.fbq||'all'; const h={...hdr()}; const who={}; state.people.forEach(p=>who[p.user_id]=p);
  const [rows,ab]=await Promise.all([
    fetch(`${URL_}/rest/v1/feedback?select=*&order=created_at.desc&limit=300`,{headers:h}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    fetch(`${URL_}/rest/v1/tool_abandon?select=*`,{headers:h}).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]);
  state.fb=rows||[];
  const counts={all:state.fb.length,question:0,rating:0,bug:0,idea:0,nothelp:0,new:0};
  state.fb.forEach(r=>{ if(counts[r.kind]!==undefined) counts[r.kind]++; if(r.helpful===false) counts.nothelp++; if(r.status==='new') counts.new++; });
  $('#fbfilters').innerHTML=[['all','All'],['new','New only'],['question','Questions'],['nothelp','Did not help'],['rating','Ratings'],['bug','Bugs'],['idea','Ideas']].map(([k,l])=>`<button class="chip ${q===k?'on':''}" data-f="${k}">${l} ${counts[k]||0}</button>`).join('');
  $$('#fbfilters .chip').forEach(b=>b.onclick=()=>{state.fbq=b.dataset.f;loadFeedback();});
  const list=state.fb.filter(r=>q==='all'||(q==='nothelp'?r.helpful===false:q==='new'?r.status==='new':r.kind===q));
  $('#fbk').className=''; $('#fbk').innerHTML=list.length?`<div class="tw"><table><thead><tr><th>What they said</th><th>Where</th><th>Who</th><th>Type</th><th>Status</th></tr></thead><tbody>${list.map(r=>{ const p=who[r.user_id]; return `<tr>
    <td class="wrap">${r.text?E(r.text):'<i class="muted">No text, marked '+(r.helpful?'helpful':'not really')+'</i>'}<span class="note" style="display:block">${when(r.created_at)}</span></td>
    <td>${E(toolName(r.tool_id))}<span class="note" style="display:block">${E(r.gate||'')}${r.job?' · '+E(r.job):''}</span></td>
    <td>${p?`<a href="#" data-p="${p.user_id}">${E(p.display_name||p.email)}</a><span class="note" style="display:block"><span class="pill ${E(p.plan)}">${PLAN_NAME[p.plan]}</span> ${E(p.status)}</span>`:'<span class="muted">'+E(r.plan||'')+'</span>'}</td>
    <td>${r.kind==='rating'?(r.helpful?'<span class="ok">helped</span>':'<span class="bad">did not help</span>'):'<span class="pill">'+E(r.kind)+'</span>'}</td>
    <td><select data-id="${E(r.id)}" class="fbst">${FB_STATUS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`; }).join('')}</tbody></table></div>`
    :'<p class="empty">Nothing yet. The widget appears after a run, and Stuck? Ask us sits in every tool header.</p>';
  $$('#fbk a[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();openPerson(a.dataset.p);});
  $$('.fbst').forEach(s=>s.onchange=async()=>{ await fetch(`${URL_}/rest/v1/feedback?id=eq.${encodeURIComponent(s.dataset.id)}`,{method:'PATCH',headers:{...hdr(),Prefer:'return=minimal'},body:JSON.stringify({status:s.value,answered_at:s.value==='answered'?new Date().toISOString():null})}).catch(()=>{}); });
  const abr=(ab||[]).map(r=>({...r,rate:r.people_opened?Math.round((1-(r.people_ran/r.people_opened))*100):0})).filter(r=>r.people_opened>=2).sort((a,b)=>b.rate-a.rate).slice(0,12);
  $('#fbab').className='funnel'; $('#fbab').innerHTML=abr.length?abr.map(r=>`<div class="fstep"><span>${E(toolName(r.tool_id))}</span><div class="fbar"><i style="width:${r.rate}%;background:${r.rate>50?'#CE3520':r.rate>25?'#F47F20':'#22834D'}"></i></div><b class="num">${r.rate}%</b><span class="note">${r.people_opened} opened</span></div>`).join('')
    :'<p class="empty">Needs a few days of tool_open and tool_run events first.</p>';
}
const _loadExtra=loadExtra; loadExtra=async function(t){ if(t==='feedback') return loadFeedback(); return _loadExtra(t); };
boot();

</script>
<script>
/* blog kit: builds the pages, the sitemap, the feed and the GEO check (27 Oct 2026) */
/* =====================================================================
   BOLDr Careers blog kit (27 Oct 2026). Pure functions, no DOM, no network:
   the Ops console uses them for the editor preview, the GEO checklist and the
   files it publishes; Node uses them to build the starting blog index.
   Every published page is plain HTML (attribute 4), with its own title,

  const okN = c.filter(x => x.ok).length; const pct = Math.round(okN / c.length * 100); const block = must.filter(x => !x.ok).length;
  const li = x => `<li class="${x.ok ? 'ok' : x.level}"><i aria-hidden="true">${x.ok ? '✓' : (x.level === 'must' ? '!' : '○')}</i><div><b>${E(x.label)}</b>${x.n ? ` <span class="bl-num">#${x.n}</span>` : ''}<small>${E(x.note || '')}</small></div></li>`;
  return `<h2>GEO check <span>${okN} of ${c.length}</span></h2><div class="bl-meter"><i style="width:${pct}%"></i></div>

}

/* ------------------------------------------------------------------ actions */
async function blSave(statusTo) {
  const p = BLOG.cur; if (!p) return false;
  const row = blPostToRow(Object.assign({}, p, statusTo ? { status: statusTo } : {}));
  if (!row.title.trim()) { blNote('bad', 'Give the post a title first.'); return false; }
  if (BLOG.posts.some(o => o.id !== p.id && o.slug === row.slug)) { blNote('bad', `Another post already uses the address /blog/${row.slug}.html. Change the address.`); return false; }
  BLOG.busy = statusTo === 'published' ? 'publish' : 'save'; render();
  try {
    let saved;
    if (p.id) {
      saved = await blRest(`blog_posts?id=eq.${encodeURIComponent(p.id)}&updated_at=eq.${encodeURIComponent(p.updated_at)}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) });
      if (!saved || !saved.length) {
        const now = await blRest(`blog_posts?id=eq.${encodeURIComponent(p.id)}&select=*`);
        BLOG.busy = '';
        if (!now.length) { blNote('bad', 'This post was deleted by someone else. Use Duplicate to keep your copy.'); return false; }
        const who = (now[0].updated_by || 'someone').split('@')[0];
        blNote('warn', `${who} saved this post at ${blWhen(now[0].updated_at)}, after you opened it.`, '<button class="b sec" data-act="force-save">Keep mine</button><button class="b sec" data-act="take-theirs">Load theirs</button>');
        BLOG.conflict = now[0]; return false;
      }
    } else {
      saved = await blRest('blog_posts', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) });
      blLocalClear({ id: null });
    }
    const post = blRowToPost(saved[0]);
    const i = BLOG.posts.findIndex(o => o.id === post.id); if (i >= 0) BLOG.posts[i] = post; else BLOG.posts.unshift(post);
    blLocalClear(post); BLOG.cur = JSON.parse(JSON.stringify(post)); BLOG.base = JSON.parse(JSON.stringify(post)); BLOG.dirty = false; BLOG.slugTouched = true; BLOG.local = null; BLOG.busy = '';
    BLOG.msg = statusTo ? null : { kind: 'ok', text: 'Saved.' }; render(); return true;
  } catch (e) {
    BLOG.busy = ''; blNote('bad', /duplicate key|unique/i.test(e.message) ? 'That address is taken. Change it.' : 'Could not save: ' + e.message); return false;
  }
}
async function blPublishSite(dry) {

  const d = await r.json().catch(() => ({ message: 'HTTP ' + r.status })); d.status = r.status; return d;
}
async function blToSite(prefix) {

}
function blDownload(name, text, type) {

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

  const names = Object.keys(files);

    if (target === 'cover') { BLOG.cur.image = url; BLOG.cur.image_alt = (BLOG.cur.cover || {}).alt || ''; blChanged(); const st = $('#bl-cvst'); if (st) st.textContent = 'Share image saved.'; blNote('ok', 'Saved. Google and LinkedIn will show this cover once the post is published.'); }

    else { blInsert('![Describe what the image shows](' + url + ')'); blNote('ok', 'Uploaded and added to the body. Replace "Describe what the image shows" with real alt text.'); }

function blLeave() { return !BLOG.dirty || confirm('You have unsaved changes. Leave without saving? (This browser keeps a copy you can bring back.)'); }

async function blAct(a, el) {
  const p = BLOG.cur;
  if (a === 'msgx') { BLOG.msg = null; const m = $('#bl-msg'); if (m) m.outerHTML = blMsg(); return; }
  if (a === 'reload') { BLOG.posts = null; BLOG.err = ''; return render(); }
  if (a === 'new') return blNew($('#bl-type').value);
  if (a === 'settings') { BLOG.view = 'settings'; BLOG.msg = null; return render(); }
  if (a === 'back') { if (!blLeave()) return; if (BLOG.dirty) blLocalSave(); BLOG.view = 'list'; BLOG.cur = null; BLOG.dirty = false; BLOG.msg = null; return render(); }
  if (a === 'dl-all') return blDownloadAll();
  if (a === 'pub-all') return blToSite('');
  if (a === 'preview') return blPreview();
  if (a === 'save') return blSave();
  if (a === 'publish') {
    const block = BK.canPublish(p, BLOG.posts);
    if (block.length) return blNote('bad', 'Fix these first: ' + block.map(x => x.label).join('; ') + '.');
    const live = p.status === 'published';
    if (!confirm(live ? 'Save and update this post on the site?' : `Publish "${p.title}"? It goes on the site${(BLOG.settings || {}).public ? ' and can be found by search.' : ', hidden (noindex) like the rest of the blog.'}`)) return;

  if (a === 'take-theirs') { if (BLOG.conflict) { const post = blRowToPost(BLOG.conflict); BLOG.conflict = null; const i = BLOG.posts.findIndex(o => o.id === post.id); if (i >= 0) BLOG.posts[i] = post; blOpen(post); } return; }
  if (a === 'local-restore') { BLOG.cur = Object.assign({}, BLOG.local.post, { id: p.id, updated_at: p.updated_at, updated_by: p.updated_by, status: p.status, published_at: p.published_at }); BLOG.local = null; BLOG.dirty = true; return render(); }

  const cvRedraw = () => { const v = $('#bl-cvp'); if (v) v.innerHTML = BK.VS.cover(BLOG.cur, BK.SECTIONS[BLOG.cur.section] ? BLOG.cur.section : 'job', 'bl-cvs'); };
  $$('#main [data-cv]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { BLOG.cur.cover = Object.assign({}, BLOG.cur.cover || {}, { [el.dataset.cv]: el.value }); blChanged(); if (el.dataset.cv === 'motif') { const y = window.scrollY; render(); window.scrollTo(0, y); } else cvRedraw(); }));
  $$('#main [data-bt]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { BLOG.cur.beats[+el.dataset.i][el.dataset.bt] = el.value; blChanged(); if (el.dataset.bt === 'kind') { const y = window.scrollY; render(); window.scrollTo(0, y); } }));
  $$('#main [data-btdel]').forEach(b => b.onclick = keep(() => { BLOG.cur.beats.splice(+b.dataset.btdel, 1); }));
  $$('#main [data-btmv]').forEach(b => b.onclick = keep(() => { const l = BLOG.cur.beats; const i = +b.dataset.btmv, j = i + +b.dataset.d; [l[i], l[j]] = [l[j], l[i]]; }));
  $$('#main [data-repadd]').forEach(b => b.onclick = keep(() => { const k = b.dataset.repadd; BLOG.cur[k] = BLOG.cur[k] || []; BLOG.cur[k].push({}); }));
  $$('#main [data-repdel]').forEach(b => b.onclick = keep(() => { BLOG.cur[b.dataset.repdel].splice(+b.dataset.i, 1); }));
  $$('#main [data-repmv]').forEach(b => b.onclick = keep(() => { const l = BLOG.cur[b.dataset.repmv]; const i = +b.dataset.i, j = i + +b.dataset.d; [l[i], l[j]] = [l[j], l[i]]; }));
  $$('#main [data-rel]').forEach(c => c.onchange = () => { const s = c.dataset.rel; const r = new Set(BLOG.cur.related || []); c.checked ? r.add(s) : r.delete(s); BLOG.cur.related = [...r]; blChanged(); });
  $$('#main [data-md]').forEach(b => b.onclick = e => { e.preventDefault(); blMd(b.dataset.md); });
  $$('#main [data-rev]').forEach(b => b.onclick = () => { const r = BLOG.revs[+b.dataset.rev]; if (!r) return; BLOG.cur = Object.assign({}, r.data || {}, { id: BLOG.cur.id, slug: BLOG.cur.slug, status: BLOG.cur.status, title: r.title, published_at: BLOG.cur.published_at, updated_at: BLOG.cur.updated_at, updated_by: BLOG.cur.updated_by }); BLOG.dirty = true; BLOG.msg = { kind: 'info', text: `Version from ${blWhen(r.saved_at)} loaded. Save to keep it.` }; render(); });
  const up = $('#bl-up'); if (up) up.onchange = () => { const t = up.dataset.target; up.dataset.target = ''; blUpload(up.files[0], t); up.value = ''; };
  const body = $('#bf-body'); if (body) body.onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); blMd('b'); } if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'i') { e.preventDefault(); blMd('i'); } };
}
document.addEventListener('keydown', e => { if (state.tab === 'blog' && BLOG.view === 'edit' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); blSave(); } });
window.addEventListener('beforeunload', e => { if (state.tab === 'blog' && BLOG.dirty) { blLocalSave(); e.preventDefault(); e.returnValue = ''; } });
if (location.hash === '#blog') { state.tab = 'blog'; $$('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'blog')); }

</script>
