const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,remember){
  try{ const html=await unlock(pw); if(remember) sessionStorage.setItem('bc.gate',pw); document.open(); document.write(html); document.close(); return true; }
  catch(e){ return false; }
}
document.getElementById('f').onsubmit=async e=>{ e.preventDefault(); const ok=await tryPw(document.getElementById('pw').value,true); if(!ok){ document.getElementById('err').style.display='block'; } };
const saved=sessionStorage.getItem('bc.gate'); if(saved){ tryPw(saved,false).then(ok=>{ if(!ok) document.body.classList.remove('unlocking'); }); } else { document.body.classList.remove('unlocking'); }
// Auth links (password recovery, email confirmation) must reach the app.
// They carry a one-time Supabase token, so they are already authenticated.
(function(){
  var h=location.hash||'', q=location.search||'';
  if(/access_token=|type=recovery|type=signup|[?&]code=/.test(h+q)){
    // Persist the auth params: document.write() below replaces the page and the
    // app boots fresh, so the only reliable carrier is sessionStorage.
    try{ sessionStorage.setItem('bc.authparams', JSON.stringify({hash:h, search:q})); }catch(e){}
    var k=sessionStorage.getItem('bc.gate');
    if(k) tryPw(k,false);
    else {
      var b=document.querySelector('.box');
      if(b) b.insertAdjacentHTML('beforeend','<small style="display:block;margin-top:12px;color:#ffd9a8">You followed a password or sign-in link. Enter the preview password once and we will take you straight there.</small>');
    }
  }
})();
</script></body></html>
