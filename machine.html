const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,remember){
  try{ const html=await unlock(pw); if(remember) sessionStorage.setItem('bc.gate',pw); document.open(); document.write(html); document.close(); return true; }
  catch(e){ return false; }
}
document.getElementById('f').onsubmit=async e=>{ e.preventDefault(); const ok=await tryPw(document.getElementById('pw').value,true); if(!ok){ document.getElementById('err').style.display='block'; } };
const saved=sessionStorage.getItem('bc.gate'); if(saved) tryPw(saved,false);
</script></body></html>
