    marathoner:[{q:'Select everything you\'ve done in your search so far',multi:true,opts:['Sent applications','Networking','Spent time on my LinkedIn','Reconnected with old colleagues','Started interviewing','Other'],open:true,interviewFollowup:true},
                {q:'Where do you feel stuck?',opts:['Getting seen, apps disappear','Converting interviews, I get them but don\'t close','My confidence, the search wore me down']}]
  };
  const INTERVIEW_STAGE_OPTS=['Recruiter screening','Hiring manager round','Peer / panel round','Multiple / final rounds'];
  const INDUSTRIES=['Technology / Software','Consumer Goods (CPG)','Retail','Finance','Healthcare','Manufacturing','Media / Entertainment','Education','Other'];
  const DIRECTIONS=['Stay in my field','An adjacent move','A real pivot, switch industry / function','A real pivot, pursue a business idea','I\'m open'];
  const ROLE_TYPES=['Full-time','Part-time','Contract','Temp'];
  const TRI_ITEMS=[['learn','Learn','Growth, new skills, a bigger challenge'],['earn','Earn','Compensation, title, financial upside'],['stability','Stability','Security, balance, a steady footing']];

  function intakeSteps(pers){
    const bq=BRANCH_Q[pers]||BRANCH_Q.scoutp;
    const steps=[{id:'situation',kind:'persona'},{id:'b1',kind:'single',q:bq[0].q,opts:bq[0].opts,open:bq[0].open,multi:bq[0].multi}];
    if(bq[0].interviewFollowup) steps.push({id:'b1_stage',kind:'single',q:'How far have your interviews gone?',opts:INTERVIEW_STAGE_OPTS,showIf:a=>{ const sel=a.b1||[]; return sel.some(i=>bq[0].opts[i]==='Started interviewing'); }});
    steps.push({id:'b2',kind:'single',q:bq[1].q,opts:bq[1].opts,open:bq[1].open,multi:bq[1].multi});
    steps.push({id:'basics',kind:'basics'});
    steps.push({id:'exp',kind:'exp'});
    steps.push({id:'direction',kind:'multi',q:'Where do you want to go?',sub:'Pick all that apply, being unsure is itself something we can help name.',opts:DIRECTIONS});
    steps.push({id:'trifecta',kind:'tri'});
    steps.push({id:'dials',kind:'dials'});
    steps.push({id:'cv',kind:'cv'});
    return steps;
  }
  function activeSteps(){ const all=intakeSteps(S_OB.pers); return all.filter(st=>!st.showIf||st.showIf(S_OB.answers)); }

  function pageOnboarding(P){

  let S_OB={i:0,pers:null,answers:{}};
  function intakeAnswered(step,a){
    if(step.kind==='persona') return !!a.pers;
    if(step.kind==='single') return step.multi?(Array.isArray(a[step.id])&&a[step.id].length>0):a[step.id]!=null;
    if(step.kind==='basics') return !!(a.roletype&&a.location&&a.manages&&(a.manages!=='Yes'||a.managenum!=null)&&(a.manages!=='No'||a.managewant));

    if(step.kind==='tri') return true;
    if(step.kind==='dials') return a.hours!=null;

  function wireIntake(P,st,steps){
    const save=()=>{ profile&&saveProfile({prefs:{...(profile.prefs||{}),intake:S_OB.answers}}); };
    const refreshNext=()=>{ const b=document.getElementById('ob-next'); if(b) b.disabled=!intakeAnswered(st,S_OB.answers); };
    if(st.kind==='persona'){ P.querySelectorAll('#pq label').forEach(l=>l.onclick=()=>{ S_OB.pers=l.querySelector('input').value; S_OB.answers.pers=S_OB.pers; S_OB.i=1; renderIntake(P); }); }
    if(st.kind==='single'&&!st.multi){
      P.querySelectorAll('#sq label').forEach(l=>l.onclick=()=>{ S_OB.answers[st.id]=+l.querySelector('input').value; renderIntake(P); });
      P.querySelector('#sq-open')?.addEventListener('input',e=>{ S_OB.answers[st.id+'_open']=e.target.value; });
    }
    if(st.kind==='single'&&st.multi){
      P.querySelectorAll('#mq2 label').forEach(l=>l.onclick=e=>{ e.preventDefault(); const i=+l.dataset.mi; const arr=S_OB.answers[st.id]||[]; const idx=arr.indexOf(i); idx>=0?arr.splice(idx,1):arr.push(i); S_OB.answers[st.id]=arr; renderIntake(P); });
      P.querySelector('#mq2-open')?.addEventListener('input',e=>{ S_OB.answers[st.id+'_open']=e.target.value; });
    }
    if(st.kind==='basics'){
      P.querySelectorAll('#ob-roletype .chip2').forEach(b=>b.onclick=()=>{ S_OB.answers.roletype=b.dataset.v; renderIntake(P); });
      P.querySelector('#ob-loc').addEventListener('input',e=>{ S_OB.answers.location=e.target.value; refreshNext(); });
      P.querySelectorAll('#ob-manages .chip2').forEach(b=>b.onclick=()=>{ S_OB.answers.manages=b.dataset.v; S_OB.answers.managenum=null; S_OB.answers.managewant=null; renderIntake(P); });
      P.querySelectorAll('#ob-managenum')?.forEach?.(()=>{});
      P.querySelector('#ob-managenum')?.addEventListener('input',e=>{ S_OB.answers.managenum=+e.target.value; refreshNext(); });
      P.querySelectorAll('#ob-managewant .chip2')?.forEach(b=>b.onclick=()=>{ S_OB.answers.managewant=b.dataset.v; refreshNext(); });

    const evidence={ t14:has('bc.store.apps'), t1:(()=>{try{const d=JSON.parse(localStorage.getItem('bc.store.inbox')||'{}');return !!d.gen||!!d.approach;}catch(e){return false;}})(),

    let changed=false;
    p.todos.forEach(t=>{ if(evidence[t.id] && !t.done){ t.done=true; changed=true; } });
    return changed;

  function detectRecovery(){
    // The preview gate replaces the document, so auth params may only survive in sessionStorage.
    let rawHash=location.hash||'', rawSearch=location.search||'';
    if(!/access_token=|type=recovery|code=/.test(rawHash+rawSearch)){
      try{ const st=JSON.parse(sessionStorage.getItem('bc.authparams')||'null');
        if(st){ rawHash=st.hash||''; rawSearch=st.search||''; sessionStorage.removeItem('bc.authparams'); }
      }catch(e){}
    } else { try{ sessionStorage.removeItem('bc.authparams'); }catch(e){} }
    const h=new URLSearchParams(rawHash.replace(/^#/,''));
    if(h.get('type')==='recovery' && h.get('access_token')){
      recoveryToken=h.get('access_token');
      history.replaceState(null,'',location.pathname);
      location.hash='#/reset'; return true;
    }
    const q=new URLSearchParams(rawSearch);
    if(q.get('type')==='recovery'||(q.get('code')&&q.get('type')!=='signup')){ pendingCode=q.get('code'); history.replaceState(null,'',location.pathname); location.hash='#/reset'; return true; }
    return false;
  }
  async function boot(){
    // surface auth errors that come back in the URL (expired link, bad redirect)
    if(location.hash.includes('error=')){ const p=new URLSearchParams(location.hash.slice(1)); const d=p.get('error_description')||p.get('error_code')||'sign-in failed'; history.replaceState(null,'',location.pathname); location.hash='#/signin'; setTimeout(()=>{ const m=document.getElementById('authmsg'); if(m) m.innerHTML='<div class="msg warn">That link didn\'t work ('+d.replace(/\+/g,' ')+'). Request a new one below.</div>'; },400); }
    detectRecovery();
    await BANK.init(); session=getSession();
    if(session){ await loadProfile(); }
    window.addEventListener('hashchange',route); route();
  }
  return {boot,go,plan,persona,canUse,creditsLeft,logUsage,PLANS,isAdmin,profile:()=>profile};
})();

/* ---- gate the tool engine by plan, meter AI runs ---- */
const _openTool=openTool;
openTool=function(id){ const t=TOOLS.find(x=>x.id===id); if(t&&!SITE.canUse(t)){ goHome(); const need=Object.keys(SITE.PLANS)[t.tier]; document.getElementById('work').insertAdjacentHTML('afterbegin',`<div class="upsell glass card"><h3>${t.name} is a ${SITE.PLANS[need].name} tool.</h3><p class="lede" style="margin:0 auto 12px">${t.desc}</p><a class="btn accent" href="#/checkout?plan=${need}">Upgrade to ${SITE.PLANS[need].name}</a></div>`); window.scrollTo(0,0); return; } _openTool(id); };
const _goHome=goHome;
goHome=function(){ _goHome(); document.querySelectorAll('#work .card').forEach(c=>{ const oc=c.getAttribute('onclick')||''; const m=oc.match(/openTool\('([^']+)'\)/); if(!m) return; const t=TOOLS.find(x=>x.id===m[1]); if(t&&!SITE.canUse(t)){ c.classList.add('locked'); const ft=c.querySelector('.ft'); if(ft) ft.insertAdjacentHTML('afterbegin','<span class="lock">🔒 '+Object.keys(SITE.PLANS)[t.tier]+'</span>'); } }); const h=document.querySelector('#work .home h1'); if(h) h.innerHTML='Your <em>tools</em>.'; const c=document.querySelector('#work .counts'); if(c) c.remove(); const l=document.querySelector('#work .home .lede'); if(l) l.textContent='Everything unlocked on your plan runs right here. Locked tools show what upgrading gives you.'; document.querySelectorAll('#work .badge.b-ai,#work .badge.b-ready,#work .badge.b-data,#work .badge.b-human').forEach(b=>b.remove()); const n=document.querySelector('#work details.need'); if(n) n.remove(); };
const _runTool=runTool;
runTool=async function(){ const t=TOOLS.find(x=>x.id===current); if(t&&t.ai&&(AI.key||AI.endpoint)){ if(SITE.creditsLeft()<=0){ document.getElementById('result').innerHTML=`<div class="notice human"><b>You've used this month's AI runs.</b> Upgrade for more, or wait for the 1st.</div>`; return; } await SITE.logUsage(t.id,'ai'); } return _runTool(); };
/* the Workbench's own boot already ran; now boot the site */
SITE.boot();
</script>
